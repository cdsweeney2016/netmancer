   accept patterns: tokens separated by spaces; abc[def] = abc plus any prefix of def; * = any one token; {regex} = a raw regex token. Matched case-insensitively against the whole line. */
var cmdDrill={
 base:[
  {lab:'add',type:'switch',id:'SW1'},{lab:'add',type:'router',id:'R1'},
  {lab:'add',type:'host',kind:'pc',id:'PC1',dhcp:true},
  {lab:'add',type:'host',kind:'pc',id:'PC2',ip:'192.168.10.11',mask:'255.255.255.0',gw:'192.168.10.1',dns:['192.168.10.5']},
  {lab:'add',type:'host',kind:'server',id:'SRV1',ip:'192.168.10.5',mask:'255.255.255.0',gw:'192.168.10.1',dns:['192.168.10.5'],dnsServer:true,tcp:[22,80,443,445],udp:[53]},
  {lab:'link',a:'PC1',ai:'eth0',b:'SW1',bi:'g0/1'},{lab:'link',a:'PC2',ai:'eth0',b:'SW1',bi:'g0/2'},{lab:'link',a:'SRV1',ai:'eth0',b:'SW1',bi:'g0/3'},{lab:'link',a:'R1',ai:'g0/0',b:'SW1',bi:'g0/24'},
  {lab:'dns',name:'srv1.lab.local',ip:'192.168.10.5'},
  {dev:'SW1',lines:['enable','configure terminal','hostname SW1','end','write memory']},
  {dev:'R1',lines:['enable','configure terminal','hostname R1','interface GigabitEthernet0/0','ip address 192.168.10.1 255.255.255.0','no shutdown','exit','ip dhcp excluded-address 192.168.10.1 192.168.10.9','ip dhcp pool LAN10','network 192.168.10.0 255.255.255.0','default-router 192.168.10.1','end','write memory']}
 ],
 cards:[
  {id:'c01',obj:['2.8'],dev:'SW1',start:'user',task:'We have a switch to look at and the prompt ends in >.\nGet to privileged EXEC from the CLI.',accept:['en[able]'],answer:'enable',note:'User EXEC (>) can only look. Privileged EXEC (#) runs every show command and is the door to configuration.',why:'IOS separates looking from changing: user EXEC (>) is read-only and limited, privileged EXEC (#) unlocks every show command, debug and the door into configuration. Also: the first thing you type on any console or SSH session; on real gear it asks for the enable secret.'},
  {id:'c02',obj:['2.8'],dev:'SW1',start:'priv',task:'We have a change to make on this switch.\nEnter global configuration mode from the CLI.',accept:['conf[igure] t[erminal]'],answer:'configure terminal',note:'The prompt becomes SW1(config)#. Everything typed here changes the running configuration at once.',why:'Global configuration mode edits the running configuration in RAM, live: each line is applied the moment you press Enter. Also: the entry point for hostnames, VLANs, routing, DHCP pools, ACLs and anything else that changes behaviour.'},
  {id:'c03',obj:['2.8'],dev:'SW1',start:'config',task:'We have a switch still called Switch; the standard says it should be ACCESS1.\nRename it from the CLI.',accept:['host[name] access1'],answer:'hostname ACCESS1',check:{type:'hostname',dev:'SW1',name:'ACCESS1'},note:'The name shows in the prompt and in CDP. Letters, digits and hyphens only.',why:'The hostname is the device\'s identity in its prompt, in CDP and LLDP advertisements, in syslog messages and in its SSH host key. Also: naming by role and site (ACCESS1, CORE-SW1) tells you what you are logged into before you change anything.'},
  {id:'c04',obj:['2.8'],dev:'SW1',start:'config',pre:['interface GigabitEthernet0/4'],where:'interface configuration for Gi0/4',task:'We have finished editing Gi0/4 and need the privileged prompt back.\nGet straight back to privileged EXEC from the CLI.',accept:['end'],answer:'end',note:'end (or Ctrl+Z) leaves every configuration level at once; exit only goes up one level.',why:'IOS modes nest: global config, then interface, line, router or DHCP pool. end (or Ctrl+Z) drops all the way back to privileged EXEC, where show commands work without do. Also: after any configuration block, before show running-config or saving.'},
  {id:'c05',obj:['2.8'],dev:'SW1',start:'priv',pre:['configure terminal','interface GigabitEthernet0/5','description drill','end'],where:'privileged EXEC, with an unsaved change',task:'We have changes on this switch that would vanish on a reload.\nSave the running configuration from the CLI.',accept:['wr[ite] m[emory]','wr[ite]','copy run[ning-config] start[up-config]'],answer:'write memory',check:{type:'saved',dev:'SW1'},note:'copy running-config startup-config is the long form. Nothing is kept across a reload until you do this.',why:'The running configuration lives in RAM; startup-config lives in NVRAM and is what boots. Saving copies RAM to NVRAM; without it a reload or a power cut loses everything you typed. Also: last step of every change window, and before any reload.'},
  {id:'c06',obj:['1.4'],dev:'SW1',start:'priv',task:'We have a user saying their port is dead.\nGrab the status, VLAN, duplex and speed of every port from the CLI.',accept:['sh[ow] int[erfaces] stat[us]'],answer:'show interfaces status',note:'connected, notconnect, disabled (shutdown) or err-disabled, then VLAN, duplex and speed.',why:'A switch port\'s status is the Layer 1 and 2 summary: connected (link up, frames flow), notconnect (no link pulse: no cable or a dead far end), disabled (shutdown) or err-disabled (a protection feature tripped). Also: finding a user\'s port, spotting a-half or 10 Mb/s mismatches, checking VLAN assignments at a glance.'},
  {id:'c07',obj:['1.4'],dev:'SW1',start:'priv',task:'We have slow transfers on the PC behind Gi0/1 and suspect a duplex mismatch.\nGrab the detail and error counters for Gi0/1 from the CLI.',accept:['sh[ow] int[erfaces] {g(?:i(?:g(?:abitethernet)?)?)?\\s?0/1}'],answer:'show interfaces GigabitEthernet0/1',note:'Read "up, line protocol is up", the duplex/speed line, and the CRC and late-collision counters that give away a duplex mismatch.',why:'The per-interface view adds counters: input errors and CRCs point at a bad cable or a duplex mismatch; late collisions mean half duplex on one side only; the duplex/speed line shows what was negotiated. Also: last input/output times, throughput, a port that flaps.'},
  {id:'c08',obj:['1.13'],dev:'SW1',start:'priv',task:'We have a PC that nobody can find on the switch.\nGrab the MAC address table from the CLI.',accept:['sh[ow] mac add[ress-table]','sh[ow] mac-add[ress-table]'],answer:'show mac address-table',note:'Dynamic entries age out after 300 seconds. The port column is how the switch forwards a frame.',why:'A switch learns the source MAC of every frame and files it under the ingress port and VLAN; this table is how it forwards unicast instead of flooding. Also: tracing a device to a port, finding a rogue device, spotting MAC flapping (a loop), seeing which ports carry many MACs (trunks or hubs).'},
  {id:'c09',obj:['2.8'],dev:'SW1',start:'priv',task:'We have a switch configured by someone else.\nGrab the running configuration from the CLI.',accept:['sh[ow] run[ning-config]'],answer:'show running-config',why:'The live configuration in RAM, which may differ from what was saved. Also: auditing someone else\'s work, finding what is applied to an interface, copying a working config. Pipe it: show running-config | section interface, or | include ip address.'},
  {id:'c10',obj:['2.8'],dev:'SW1',start:'priv',task:'We have a switch that may boot with an older configuration.\nGrab the startup configuration from the CLI.',accept:['sh[ow] start[up-config]'],answer:'show startup-config',note:'If it differs from the running configuration, someone forgot to save.',why:'What the device boots with. Compare it with the running configuration to know whether a change was saved; a difference means a reload rolls back. Also: confirming a save before a maintenance window.'},
  {id:'c11',obj:['1.10'],dev:'SW1',start:'priv',task:'We have a switch and need its interface addresses and states at a glance.\nGrab the one-table interface summary from the CLI.',accept:['sh[ow] ip int[erface] br[ief]'],answer:'show ip interface brief',why:'One line per interface: address, Status (Layer 1 and admin state: up, down, administratively down) and Protocol (Layer 2: up or down). Also: the first command on any router troubleshoot; up/down means the cable is in but the line protocol failed; administratively down means a missing no shutdown.'},
  {id:'c12',obj:['1.1'],dev:'SW1',start:'priv',task:'We have an audit asking for the software version, uptime and model.\nGrab them from the CLI.',accept:['sh[ow] ver[sion]'],answer:'show version',why:'Software image and version, uptime (did it just reboot?), the reason for the last reload, hardware model, memory and the configuration register. Also: catching a crash (uptime reset), confirming an image before an upgrade, reading the serial for support.'},
  {id:'c13',obj:['2.8'],dev:'SW1',start:'config',task:'We have a change to make on Gi0/2.\nEnter its interface configuration from the CLI.',accept:['int[erface] {g(?:i(?:g(?:abitethernet)?)?)?\\s?0/2}'],answer:'interface GigabitEthernet0/2',note:'Prompt: SW1(config-if)#. The short forms g0/2, gi0/2 and gig0/2 all work.',why:'Per-port settings live in interface configuration: description, speed, duplex, VLAN membership, shutdown. Also: interface range g0/1 - 24 applies one setting to many ports at once.'},
  {id:'c14',obj:['1.4'],dev:'SW1',start:'config',pre:['interface GigabitEthernet0/1'],where:'interface configuration for Gi0/1',task:'We have a legacy device on Gi0/1 that only runs at 100 Mb/s.\nForce this port to 100 Mb/s from the CLI.',accept:['speed 100'],answer:'speed 100',check:{type:'running_has',dev:'SW1',re:'^ speed 100$',label:'Gi0/1 is set to speed 100'},note:'Forcing one end while the other autonegotiates is the classic duplex mismatch: the auto side falls back to half duplex.',why:'Autonegotiation exchanges link pulses to agree speed and duplex; forcing a speed turns it off on this side, so the other end must be forced too or it falls back to half duplex. Also: legacy gear that cannot negotiate, a flapping link with a known-bad NIC.'},
  {id:'c15',obj:['1.4'],dev:'SW1',start:'config',pre:['interface GigabitEthernet0/1'],where:'interface configuration for Gi0/1',task:'We have an old device on Gi0/1 that cannot negotiate duplex.\nForce full duplex on this port from the CLI.',accept:['dup[lex] full'],answer:'duplex full',check:{type:'running_has',dev:'SW1',re:'^ duplex full$',label:'Gi0/1 is set to duplex full'},why:'Full duplex sends and receives at once on separate pairs, so there are no collisions; half duplex shares the medium with CSMA/CD. A mismatch (one side full, one half) works, slowly, with late collisions and CRC errors. Also: only safe when both ends are forced.'},
  {id:'c16',obj:['1.4'],dev:'SW1',start:'config',pre:['interface GigabitEthernet0/1','speed 100','duplex full'],where:'interface configuration for Gi0/1, currently forced to 100/full',task:'We have Gi0/1 forced to 100/full and the device on it has been replaced.\nPut speed and duplex back to autonegotiation from the CLI (two commands).',accept:['speed auto','no speed','dup[lex] auto','no dup[lex]'],answer:'speed auto\nduplex auto',check:{type:'speed_duplex',dev:'SW1',if:'g0/1',speed:'auto',duplex:'auto',how:'config'},note:'With both ends on auto, Gigabit ports negotiate 1000/full by themselves.',why:'Both ends negotiating is the normal state; Gigabit Ethernet requires autonegotiation and always runs full duplex. Also: undoing a forced setting after a legacy device is replaced; most \'slow link\' tickets end here.'},
  {id:'c17',obj:['1.4'],dev:'SW1',start:'config',pre:['interface GigabitEthernet0/2'],where:'interface configuration for Gi0/2',task:'We have a rogue device on Gi0/2.\nShut the port down from the CLI.',accept:['shut[down]'],answer:'shutdown',check:{type:'iface_down',dev:'SW1',if:'g0/2'},note:'show interfaces status then says disabled; the PC on it loses link.',why:'Administratively disabling a port drops the link (the far end sees link down), stops forwarding and shows as disabled. Also: isolating a rogue device or a looped cable, parking unused ports for security, bouncing a port so a device re-DHCPs.'},
  {id:'c18',obj:['1.4'],dev:'SW1',start:'config',pre:['interface GigabitEthernet0/2','shutdown'],where:'interface configuration for Gi0/2, which is shut down',task:'We have Gi0/2 shut down and the rogue device is gone.\nBring the port back up from the CLI.',accept:['no shut[down]'],answer:'no shutdown',check:{type:'iface_up',dev:'SW1',if:'g0/2'},note:'Most IOS settings are undone with no in front of them.',why:'Most IOS settings are undone with no in front. The port negotiates again, the device on it gets link and, if on DHCP, renews. Also: the fix for \'administratively down\' on any interface; router ports ship shut down.'},
  {id:'c19',obj:['2.8'],dev:'SW1',start:'config',pre:['interface GigabitEthernet0/3'],where:'interface configuration for Gi0/3',task:'We have no idea what plugs into Gi0/3, and it is the server.\nLabel this port SRV1 uplink from the CLI.',accept:['desc[ription] srv1 uplink'],answer:'description SRV1 uplink',check:{type:'port_desc',dev:'SW1',if:'g0/3',re:'srv1 uplink'},note:'Descriptions show in show interfaces status and save the next person a cable trace.',why:'A description is text only, no effect on traffic, but it shows in show interfaces status, show interfaces and in monitoring. Also: label uplinks, servers, phones and WAN circuits with their circuit IDs so nobody has to trace cables.'},
  {id:'c20',obj:['2.8'],dev:'SW1',start:'config',task:'We have a switch we cannot SSH to because it has no address.\nGive it 192.168.10.2/24 on VLAN 1 and enable the interface from the CLI (three commands).',accept:['ip add[ress] 192.168.10.2 255.255.255.0'],answer:'interface vlan 1\nip address 192.168.10.2 255.255.255.0\nno shutdown',check:{type:'svi_ip',dev:'SW1',vlan:1,ip:'192.168.10.2'},note:'A Layer 2 switch is managed through an SVI: interface Vlan1 with an address, so you can SSH to it.',why:'A Layer 2 switch has no routed ports; its management address lives on a switch virtual interface (SVI) in a VLAN, which comes up when the VLAN exists and a port in it is up. Also: the address you SSH and SNMP to; on a Layer 3 switch SVIs are the VLAN gateways.'},
  {id:'c21',obj:['2.8'],dev:'SW1',start:'config',task:'We have a switch that answers on its own subnet but not from the office next door.\nSet its default gateway to 192.168.10.1 from the CLI.',accept:['ip default-gateway 192.168.10.1'],answer:'ip default-gateway 192.168.10.1',check:{type:'default_gw',dev:'SW1',ip:'192.168.10.1'},note:'A switch has no routing table; this one address is where it sends everything off-subnet.',why:'With ip routing off a switch only knows its own subnet; this one address is where it sends replies to management traffic from anywhere else. Also: without it you can SSH from the switch\'s own subnet but not from the office next door; NTP, syslog and TFTP to remote servers need it too.'},
  {id:'c22',obj:['1.10'],dev:'SW1',start:'priv',pre:['configure terminal','interface vlan 1','ip address 192.168.10.2 255.255.255.0','no shutdown','end'],where:'privileged EXEC; the switch has 192.168.10.2 on Vlan1',task:'We have given the switch an address and want to prove it reaches the router.\nPing 192.168.10.1 from the CLI.',accept:['ping 192.168.10.1'],answer:'ping 192.168.10.1',note:'!!!!! is five replies; a dot is a timeout. The first ping often shows .!!!! while ARP resolves.',why:'ICMP echo from the switch\'s SVI proves Layer 1 to 3 both ways: cable, VLAN, address, ARP and the return path. !!!!! is five replies, a dot is a timeout, and the first dot is usually ARP resolving. Also: checking the gateway before SSH, ping with a source address to test from a specific SVI.'},
  {id:'c23',obj:['1.6'],dev:'R1',start:'config',task:'We have a new LAN that needs Gi0/1 as its gateway, 192.168.20.1/24.\nAddress and enable the interface from the CLI (three commands).',accept:['ip add[ress] 192.168.20.1 255.255.255.0'],answer:'interface GigabitEthernet0/1\nip address 192.168.20.1 255.255.255.0\nno shutdown',check:[{type:'iface_ip',dev:'R1',if:'g0/1',ip:'192.168.20.1',mask:'255.255.255.0'},{type:'running_has',dev:'R1',re:'^interface GigabitEthernet0/1\\n ip address 192.168.20.1 255.255.255.0\\n(?! shutdown)',label:'R1 Gi0/1 is not shut down'}],note:'There is no gateway command on a router: the address you give the interface is what the LAN uses as its gateway. Router ports are shut down out of the box; no shutdown is the step everyone forgets.',why:'A router interface is the gateway for its subnet: hosts send off-subnet traffic to its MAC and the router routes by destination IP. The address and mask create the connected route (C and L in show ip route); no shutdown brings it up. Also: every new LAN starts here.'},
  {id:'c24',obj:['3.1'],dev:'R1',start:'priv',task:'We have packets going nowhere and need to see what the router knows.\nGrab the routing table from the CLI.',accept:['sh[ow] ip route'],answer:'show ip route',note:'C connected, L local, S static, O OSPF. A router only forwards to networks that are in this table.',why:'The routing table is what the router actually uses: connected (C), local (L), static (S), learned (O for OSPF). The longest matching prefix wins, then administrative distance. Also: \'destination unreachable\' tickets, a missing default route (S* 0.0.0.0/0), verifying OSPF learned a network.'},
  {id:'c25',obj:['4.3'],dev:'R1',start:'priv',task:'We have a PC that says it got no address.\nGrab the DHCP leases the router has handed out from the CLI.',accept:['sh[ow] ip dhcp bind[ing]'],answer:'show ip dhcp binding',note:'Address, client MAC (as a client identifier), lease expiry and type.',why:'The server\'s lease table: which address went to which client identifier (MAC) and when it expires. Also: a PC on 169.254.x.x (APIPA) never got here; duplicate-address complaints; finding a device\'s IP from its MAC; clear ip dhcp binding for a stale lease.'},
  {id:'c26',obj:['4.3'],dev:'R1',start:'config',task:'We have gear with fixed addresses 192.168.20.1 to .9 on the new LAN.\nKeep them out of the DHCP range from the CLI.',accept:['ip dhcp excl[uded-address] 192.168.20.1 192.168.20.9'],answer:'ip dhcp excluded-address 192.168.20.1 192.168.20.9',check:{type:'running_has',dev:'R1',re:'^ip dhcp excluded-address 192.168.20.1 192.168.20.9$',label:'192.168.20.1 to .9 are excluded'},note:'Excluded addresses are global, not per pool. Keep the gateway, servers and printers out of the range.',why:'DHCP hands out any unused address in the pool\'s network unless it is excluded; gateways, servers and printers with static addresses must be excluded or the server will lease them to a client. Excluded addresses are global, not per pool. Also: reserving a block for future static devices.'},
  {id:'c27',obj:['4.3'],dev:'R1',start:'config',task:'We have a new LAN 192.168.20.0/24 with no DHCP.\nCreate pool LAN20 with 192.168.20.1 as the gateway from the CLI (three commands).',accept:['network 192.168.20.0 255.255.255.0'],answer:'ip dhcp pool LAN20\nnetwork 192.168.20.0 255.255.255.0\ndefault-router 192.168.20.1',check:{type:'running_has',dev:'R1',re:'^ip dhcp pool LAN20\\n network 192.168.20.0 255.255.255.0\\n default-router 192.168.20.1',label:'Pool LAN20 serves 192.168.20.0/24 with gateway .1'},note:'The router matches a request to the pool whose network contains the interface it arrived on.',why:'A pool names a network; the router matches a Discover to the pool whose network contains the interface it arrived on (or the relay\'s address). default-router becomes the client\'s gateway, dns-server its resolvers. Also: one pool per VLAN on a router-on-a-stick; lease days hours sets the lease time.'},
  {id:'c28',obj:['4.3'],dev:'R1',start:'config',pre:['ip dhcp pool LAN10'],where:'DHCP pool configuration for LAN10 ((dhcp-config)#)',task:'We have clients on LAN10 that get an address but cannot resolve names.\nHand them 192.168.10.5 as their DNS server from the CLI.',accept:['dns-server 192.168.10.5'],answer:'dns-server 192.168.10.5',check:{type:'running_has',dev:'R1',re:'^ dns-server 192.168.10.5$',label:'Pool LAN10 hands out DNS 192.168.10.5'},note:'Clients pick it up on their next renew. Up to eight servers, in order of preference.',why:'DHCP carries more than an address: option 6 lists DNS servers, option 3 the gateway, option 15 the domain name. Clients pick it up on their next renew. Also: changing DNS for a whole site in one line, pointing clients at a new resolver after a migration.'},
  {id:'c29',obj:['1.10'],dev:'R1',start:'priv',task:'We have a host that pings from the router but is not where the paperwork says.\nGrab the router\'s ARP cache from the CLI.',accept:['sh[ow] arp','sh[ow] ip arp'],answer:'show ip arp',note:'The MAC the router resolved for each neighbour. No entry after a ping means the host never answered ARP.',why:'ARP maps an IPv4 address to a MAC on a connected subnet; the router caches each answer. An Incomplete entry means the host never answered: wrong VLAN, dead host, wrong subnet. Also: finding a host\'s MAC to trace it on the switch, confirming a duplicate address (the MAC changes).'},
  {id:'c30',obj:['1.10'],dev:'R1',start:'priv',task:'We have a router with an interface that may be shut down.\nGrab the one-table interface summary from the CLI.',accept:['sh[ow] ip int[erface] br[ief]'],answer:'show ip interface brief',note:'Status is the physical/admin state, Protocol is Layer 2. "administratively down" means a missing no shutdown.',why:'Same table on a router: the address and Layer 1/2 state of every interface. Also: administratively down is a missing no shutdown; up/down means line protocol failed (keepalives, encapsulation, the far end).'},
  {id:'c31',obj:['2.8'],dev:'R1',start:'priv',pre:['configure terminal','interface GigabitEthernet0/1','description drill','end'],where:'privileged EXEC, with an unsaved change',task:'We have router changes that would vanish on a reload.\nSave the configuration from the CLI.',accept:['wr[ite] m[emory]','wr[ite]','copy run[ning-config] start[up-config]'],answer:'copy running-config startup-config\n',check:{type:'saved',dev:'R1'},note:'IOS asks for the destination filename; press Enter to accept startup-config. write memory skips the question.',why:'The long form of saving: copy asks for the destination filename and Enter accepts startup-config. Also: copy running-config tftp: backs up to a server; copy tftp: running-config merges a saved config back in.'},
  {id:'c32',obj:['1.10'],dev:'PC1',start:'cmd',task:'We have a PC with "no internet" and need its address, mask and gateway.\nGrab them from the CLI.',accept:['ipconfig','ipconfig /all'],answer:'ipconfig',why:'The PC\'s own IPv4 settings: address, mask, default gateway. 169.254.x.x (APIPA) means DHCP failed; no gateway means no off-subnet traffic. Also: the first command on any \'no internet\' call; confirming a static address was applied.'},
  {id:'c33',obj:['1.10'],dev:'PC1',start:'cmd',task:'We have a PC that may be on the wrong DHCP server.\nGrab the MAC address, DHCP server, lease times and DNS servers from the CLI.',accept:['ipconfig /all'],answer:'ipconfig /all',note:'DHCP Enabled, DHCP Server and the lease times tell you where the address came from.',why:'Adds the MAC address, whether DHCP is enabled, which server leased the address and when, and the DNS servers in use. Also: catching a static DNS override, a lease from a rogue DHCP server, the wrong domain suffix.'},
  {id:'c34',obj:['4.3'],dev:'PC1',start:'cmd',task:'We have fixed the DHCP pool and the PC still has an old address.\nAsk the server for a fresh lease from the CLI.',accept:['ipconfig /renew'],answer:'ipconfig /renew',note:'Discover, Offer, Request, Acknowledge. A timeout means the server is unreachable or has no pool for this subnet.',why:'The client restarts DORA: Discover (broadcast), Offer, Request, Acknowledge. A timeout means no server answered on this subnet: no pool, no relay, the port is down, or the wrong VLAN. Also: picking up a changed gateway or DNS option without a reboot.'},
  {id:'c35',obj:['4.3'],dev:'PC1',start:'cmd',task:'We have a PC moving to another subnet and its lease should go back.\nRelease the lease from the CLI.',accept:['ipconfig /release'],answer:'ipconfig /release',note:'The PC keeps no address until the next renew.',why:'Sends a DHCP Release so the server can reuse the address at once; the PC has no address until the next renew. Also: moving a PC to another subnet cleanly, clearing a lease from a rogue server before fixing the port.'},
  {id:'c36',obj:['1.10'],dev:'PC1',start:'cmd',task:'We have a PC that cannot reach anything.\nTest reachability to the gateway 192.168.10.1 from the CLI.',accept:['ping 192.168.10.1'],answer:'ping 192.168.10.1',note:'Reply = Layer 1 to 3 work both ways. Request timed out = no answer; Destination host unreachable = no route or no ARP reply.',why:'ICMP echo to the gateway tests cable, switch port, VLAN, address, mask and ARP in both directions. Reply: Layer 1 to 3 are fine locally. Destination host unreachable: no route or no ARP reply. Request timed out: sent, nothing came back. Also: ping 127.0.0.1 tests the stack, ping 8.8.8.8 tests routing beyond, ping by name tests DNS.'},
  {id:'c37',obj:['1.10'],dev:'PC1',start:'cmd',task:'We have slow access to the server at 192.168.10.5.\nGrab the hop-by-hop path from the CLI.',accept:['tracert 192.168.10.5'],answer:'tracert 192.168.10.5',note:'Each line is a router that returned a TTL-exceeded message. On the same subnet there is one hop: the host.',why:'Sends probes with TTL 1, 2, 3 and so on; each router that drops one returns ICMP Time Exceeded, which names the hop; the destination answers Echo Reply. Also: finding where a path dies, spotting a routing loop, seeing which hop adds the latency.'},
  {id:'c38',obj:['1.13'],dev:'PC1',start:'cmd',task:'We have a duplicate-address complaint on the LAN.\nGrab the PC\'s ARP cache from the CLI.',accept:['arp -a'],answer:'arp -a',note:'dynamic entries were learned by ARP; the switch learns the same MACs on its ports.',why:'The PC\'s ARP cache: which MAC answers for each neighbour. A duplicate address shows as the MAC changing; no entry for the gateway means no ARP reply ever came. Also: confirming the gateway\'s MAC is the router\'s, spotting ARP spoofing.'},
  {id:'c39',obj:['1.6'],dev:'PC1',start:'cmd',task:'We have a PC that must keep 192.168.10.50/24 with gateway 192.168.10.1.\nSet that static address on the Ethernet adapter from the CLI.',accept:['netsh int[erface] ip set add[ress] "ethernet" static 192.168.10.50 255.255.255.0 192.168.10.1','netsh int[erface] ip set add[ress] name="ethernet" source=static add[ress]=192.168.10.50 mask=255.255.255.0 gateway=192.168.10.1'],answer:'netsh interface ip set address "Ethernet" static 192.168.10.50 255.255.255.0 192.168.10.1',check:{type:'host_ip',host:'PC1',ip:'192.168.10.50'},note:'Order: address, mask, gateway. The adapter name must match exactly, quotes included.',why:'Static addressing bypasses DHCP: address, mask and gateway are fixed on the adapter, and the mask decides what is local and what goes to the gateway. Also: servers, printers and management ports; a wrong mask is the classic \'reaches some hosts, not others\'.'},
  {id:'c40',obj:['4.3'],dev:'PC2',start:'cmd',where:'the command prompt on PC2, which has a static address',task:'We have PC2 on a static address that should come from DHCP.\nPut the adapter back on DHCP from the CLI.',accept:['netsh int[erface] ip set add[ress] "ethernet" dhcp','netsh int[erface] ip set add[ress] name="ethernet" source=dhcp'],answer:'netsh interface ip set address "Ethernet" dhcp',check:{type:'lease',host:'PC2'},note:'The PC asks for a lease at once. A static DNS server set separately stays until you also set dns to dhcp.',why:'Back on DHCP the adapter broadcasts a Discover at once and takes the lease with its gateway and DNS options. A static DNS server set separately stays until you also set dns to dhcp. Also: undoing a technician\'s static address when a laptop moves between sites.'},
  {id:'c41',obj:['4.3'],dev:'PC2',start:'cmd',task:'We have a user who cannot open srv1.lab.local by name.\nResolve it and see which server answered, from the CLI.',accept:['nslookup srv1.lab.local'],answer:'nslookup srv1.lab.local',note:'The first two lines name the DNS server asked; "Non-existent domain" means that server has no record for the name.',why:'A DNS query to the configured server: the first two lines name the server that answered (by reverse lookup) and its address, then the record, or Non-existent domain (NXDOMAIN: the server has no record) or a timeout (the server is unreachable). Also: nslookup name server asks a specific server; separates a DNS fault from an application fault.'},
  {id:'c42',obj:['4.3'],dev:'PC2',start:'cmd',task:'We have PC2 pointed at a dead DNS server.\nPoint its DNS at 192.168.10.5 statically from the CLI.',accept:['netsh int[erface] ip set dns "ethernet" static 192.168.10.5','netsh int[erface] ip set dns name="ethernet" source=static add[ress]=192.168.10.5'],answer:'netsh interface ip set dns "Ethernet" static 192.168.10.5',note:'A static DNS server overrides what DHCP offers, and it stays until you hand DNS back with set dns "Ethernet" dhcp.',why:'The resolver list is per adapter; a static entry overrides DHCP\'s option 6 and survives renews. Also: pointing a PC at a test resolver, working around a broken DHCP option; set it back to dhcp afterwards.'},
  {id:'c43',obj:['1.5'],dev:'PC1',start:'ps',where:'PowerShell on PC1',task:'We have a web server at 192.168.10.5 that pings but will not load.\nTest TCP port 80 from PowerShell.',accept:['test-netconnection 192.168.10.5 -port 80','test-netconnection -computername 192.168.10.5 -port 80'],answer:'Test-NetConnection 192.168.10.5 -Port 80',note:'TcpTestSucceeded : True means something is listening. Ping can succeed while this fails: the host is up, the service is not.',why:'Opens a TCP three-way handshake (SYN, SYN-ACK, ACK) to the port: True means something is listening and nothing blocked it. Ping can succeed while this fails: host up, service down, or a firewall. Also: 443 to a web server, 3389 to RDP, 22 to SSH, from the client\'s point of view.'},
  {id:'c44',obj:['1.5'],dev:'SRV1',start:'sh',task:'We have a server that should be serving web and DNS.\nGrab the listening TCP and UDP sockets with their programs from the CLI.',accept:['ss {-[tulnp]{2,5}}'],answer:'ss -tulpn',note:'t TCP, u UDP, l listening only, n numeric ports, p the process. 0.0.0.0:80 listens on every interface.',why:'Sockets in LISTEN state: t TCP, u UDP, l listening, n numeric, p the owning process. 0.0.0.0:80 listens on every address; 127.0.0.1:53 only locally. Also: \'is the service even running\' before blaming the network; which process holds a port.'},
  {id:'c45',obj:['1.10'],dev:'SRV1',start:'sh',task:'We have a server that may have the wrong address.\nGrab its interfaces and addresses from the CLI.',accept:['ip a[ddress]','ip a[ddress] sh[ow]','ip addr sh[ow]'],answer:'ip address show',note:'ip a is the usual short form. inet is the IPv4 address with its prefix length.',why:'The Linux adapter view: addresses with prefix length (inet 192.168.10.5/24), link state (UP, LOWER_UP means the cable is connected) and the MAC. Also: the first command on any Linux host; ip r shows the routes and the default gateway.'},
  {id:'c46',obj:['4.3'],dev:'SRV1',start:'sh',task:'We have a name that resolves on one PC and not another.\nQuery the DNS server 192.168.10.5 for srv1.lab.local from the CLI.',accept:['dig srv1.lab.local','dig @192.168.10.5 srv1.lab.local'],answer:'dig @192.168.10.5 srv1.lab.local',note:'@server picks the server to ask; without it dig uses the resolver in /etc/resolv.conf. The ANSWER SECTION holds the A record.',why:'Shows the whole DNS exchange: the question, the ANSWER SECTION with the record and its TTL, the status (NOERROR, NXDOMAIN, SERVFAIL) and which server answered. @server asks a specific server. Also: comparing two servers\' answers, checking TTLs before a change, other record types (dig MX example.com).'}
 ],
 badges:[{id:'first',name:'First blood',blurb:'Your first correct answer.'},{id:'clean',name:'Clean sweep',blurb:'A session of eight or more with every card right first time.'},{id:'run10',name:'Ten in a row',blurb:'Ten first-try answers in a row.'},{id:'fluent5',name:'Fast hands',blurb:'Five cards fluent: three first-try answers each, all quick.'},{id:'dev:SW1',name:'Switch hand',blurb:'Every switch card known.'},{id:'dev:R1',name:'Router hand',blurb:'Every router card known.'},{id:'dev:PC',name:'Desktop support',blurb:'Every PC card known.'},{id:'dev:SRV1',name:'Server room',blurb:'Every server card known.'},{id:'deck',name:'Module 1 known',blurb:'Every card in the deck known.'},{id:'deckfluent',name:'Module 1 fluent',blurb:'Every card in the deck fluent.'},{id:'hundred',name:'Hundred club',blurb:'One hundred correct answers.'},{id:'comeback',name:'Comeback',blurb:'A session after a week or more away.'},{id:'scholar',name:'Scholar',blurb:'Five times: revealed a card, then got it first time on its next showing.'},{id:'explorer',name:'Explorer',blurb:'Used ? or Tab twenty-five times during cards.'}]};
/* ---------- guided walkthroughs (Academy "Guide me"): what matters in the request and why, then one step at a time ----------
   facts: quotes from the symptom or brief (must match the text) with why they matter.
   steps: {dev, cmd (accept pattern or list, see cmdMatch), show (the command to type), look (what to read), why}
          or {dev, lines[] (the fix, typed in order), check (a CHECKS entry proving it landed), why}.
   Tickets without a guide get one built from their hints and solution (guideAuto). */
var guides={
 'T-001':{
  facts:[{q:'No internet, no email, nothing',why:'Everything is dead, not one service: that points below IP, at the link or the address, not at DNS or a route.'},
         {q:'The cable is definitely plugged in',why:'The user checked the desk end. A cable has two ends; the switch end can be switched off in software.'},
         {q:'Hot desk 5 is patched to SW1 Gi0/5',why:'The exact switch and port. Half of troubleshooting is knowing where to look; this is handed to you.'}],
  steps:[{dev:'LAPTOP-7',cmd:'ipconfig',show:'ipconfig',look:'Media disconnected, or an address starting 169.254: the NIC sees no link, so DHCP never got a lease.',why:'Start at the device that complains. ipconfig tells you in one screen whether the problem is link (Layer 1), address (DHCP) or beyond.'},
         {dev:'SW1',cmd:'sh[ow] int[erfaces] stat[us]',show:'show interfaces status',look:'The Gi0/5 line. "disabled" means a person shut the port; "notconnect" would mean a cable or client fault.',why:'The switch sees the other end of the cable. One table shows the state of every port, so you confirm the fault before touching anything.'},
         {dev:'SW1',lines:['enable','configure terminal','interface g0/5','no shutdown','end'],check:{type:'iface_up',dev:'SW1',if:'g0/5'},why:'shutdown is an administrative state saved in the configuration; only no shutdown clears it. The port negotiates link again and the laptop\'s DHCP client asks for a lease on its own.'},
         {dev:'LAPTOP-7',cmd:['ipconfig','ipconfig /all','ipconfig /renew'],show:'ipconfig',look:'An address in 10.10.10.0/24 and a default gateway of 10.10.10.1.',why:'Never close on "it should work". The client view proves the lease arrived after the link came up.'},
         {dev:'LAPTOP-7',cmd:'ping 8.8.8.8',show:'ping 8.8.8.8',look:'Replies. Then Check my fix.',why:'An end-to-end test from the user\'s seat is the only proof the user cares about.'}],
  done:'A shut port looks exactly like a dead cable from the desk. The switch table is the first place to settle which it is.'},
 'T-002':{
  facts:[{q:'Every website says it can\'t be reached, and the intranet is down too',why:'Both fail by name: internal and external. One service turns names into numbers for both.'},
         {q:'the office chat app still works',why:'Chat clients connect to a fixed address. Something that works without names means IP, routing and the link are fine.'},
         {q:'pinging 8.8.8.8 like you told me last time and that works fine',why:'Reaching the internet by number proves the gateway and the route. That leaves DNS.'},
         {q:'An old DNS server, 10.10.10.53, was retired last month',why:'A dead address a client might still be pointed at. Names in the brief are often the answer in disguise.'}],
  steps:[{dev:'PC-DANA',cmd:'ipconfig /all',show:'ipconfig /all',look:'The DNS Servers line: 10.10.10.53, the retired server. Also whether DHCP is enabled; a static DNS entry overrides what DHCP hands out.',why:'ipconfig alone hides DNS. /all shows where the resolver list came from, which is the whole case here.'},
         {dev:'PC-DANA',cmd:'nslookup intranet.netmancer.local',show:'nslookup intranet.netmancer.local',look:'The server it asks (10.10.10.53) and a timeout: the query goes to a server that no longer exists.',why:'nslookup separates "DNS is broken" from "the website is down": it shows which server is asked and what it says.'},
         {dev:'PC-DANA',lines:['netsh interface ip set dns "Ethernet" static 10.10.10.5'],check:{type:'resolve',host:'PC-DANA',name:'intranet.netmancer.local'},why:'Point the adapter at the live server. Handing DNS back to DHCP (set dns "Ethernet" dhcp) also works and is the better long-term fix, since DHCP already advertises 10.10.10.5.'},
         {dev:'PC-DANA',cmd:'nslookup *',show:'nslookup www.example.com',look:'Server 10.10.10.5 answers with an address. Then Check my fix.',why:'Verify with the same tool that showed the fault, against a public name as well as the intranet.'}],
  done:'Chat worked and ping worked because neither needs a name. A static DNS server survives every DHCP renew, so it outlived the server it pointed at.'},
 'T-003':{
  facts:[{q:'can print and open the file share, but no websites load at all',why:'Same-subnet destinations work, off-subnet ones fail. Only one setting is used for leaving the subnet: the default gateway.'},
         {q:'static address because it runs the door badge software',why:'A constraint: the address must stay. Fix the gateway without touching the IP.'},
         {q:'must keep its reserved address 10.10.10.57/24',why:'The exact address and mask you must preserve; the mask also tells you which gateway addresses are even possible.'},
         {q:'The office gateway is R1 at 10.10.10.1',why:'The correct value, given. Compare it with what the PC has.'}],
  steps:[{dev:'PC-NEW',cmd:'ipconfig',show:'ipconfig',look:'IPv4 address 10.10.10.57, mask 255.255.255.0, default gateway 10.10.1.1. The gateway is outside 10.10.10.0/24.',why:'A host can only ARP for a gateway inside its own subnet. 10.10.1.1 is in 10.10.1.0/24, so every off-subnet packet has nowhere to go.'},
         {dev:'PC-NEW',cmd:'tracert *',show:'tracert 8.8.8.8',look:'It fails at the first hop: the PC never reaches a router.',why:'tracert shows how far packets get. Dying at hop 1 means the gateway itself is unreachable, not something beyond it.'},
         {dev:'PC-NEW',lines:['netsh interface ip set address "Ethernet" static 10.10.10.57 255.255.255.0 10.10.10.1'],check:{type:'reach',from:'PC-NEW',to:'8.8.8.8',port:0,label:'PC-NEW reaches 8.8.8.8'},why:'netsh sets address, mask and gateway in one line; repeating the same address keeps the reservation and changes only the gateway.'},
         {dev:'PC-NEW',cmd:'ping *',show:'ping 8.8.8.8',look:'Replies. Then Check my fix.',why:'Proves the new gateway forwards; the printer and the share still work because they never needed it.'}],
  done:'Half-working is the signature of a gateway fault: everything local is fine, everything beyond the subnet is dead.'},

  facts:[{q:'Everyone else in Accounting is fine',why:'One desk, not the subnet: the fault is on this PC, its cable or its switch port, not on the share or the uplink.'},
         {q:'Pings look normal',why:'Pings are tiny and few. A duplex mismatch passes them and only hurts bulk traffic, so "pings are fine" does not clear the link.'},
         {q:'patched to SW1 Gi0/8',why:'The port to look at.'},
         {q:'left on auto-negotiation (company standard)',why:'The PC negotiates. If the switch side is forced, the two ends disagree and the PC falls back to half duplex.'}],
  steps:[{dev:'SW1',cmd:'sh[ow] int[erfaces] stat[us]',show:'show interfaces status',look:'The Gi0/8 line: Duplex and Speed without the a- prefix (full, 100) mean the switch side is forced; a negotiated port shows a-full a-1000.',why:'One table shows every port\'s negotiated state. A forced value on one side is the mismatch in plain sight.'},
         {dev:'SW1',cmd:'sh[ow] int[erfaces] {g(?:i(?:g(?:abitethernet)?)?)?\\s?0/8}',show:'show interfaces g0/8',look:'The counters: CRC errors and runts on this (full) side; the half-duplex side would log late collisions. Small pings slip through; file copies trip over them.',why:'Counters turn a suspicion into evidence. CRC and runts on a full-duplex port facing an auto device is the textbook mismatch.'},
         {dev:'SW1',lines:['enable','configure terminal','interface g0/8','speed auto','duplex auto','end'],check:{type:'link_full',dev:'SW1',if:'g0/8'},why:'Both ends must negotiate, or both must be forced identically. Putting the switch back to auto lets the PC and the port agree on 1000/full.'},

  facts:[{q:'Sometimes it works, sometimes the queue says the printer is offline',why:'Intermittent on a fixed address means two devices are answering for it: whoever replied to ARP last gets the traffic.'},

         {q:'Facilities installed some new smart thermostat yesterday',why:'The timeline. A new device with a typed-in address is the usual intruder.'},
         {q:'PRN-1 is permanently 10.10.10.40',why:'The address that must stay with the printer; the constraint for the fix.'},
         {q:'DHCP hands out 10.10.10.100 and up',why:'Where a correctly configured device would land; anything below .100 was typed by hand.'}],
  steps:[{dev:'PC-DANA',cmd:'ping 10.10.10.40',show:'ping 10.10.10.40',look:'Replies, as the user said. Watch the reply source: it is "from" 10.10.10.40 either way.',why:'Ping first so the PC has to ARP for the address; the ARP cache is the evidence you need next.'},

         {dev:'SW1',cmd:'sh[ow] mac add[ress-table]',show:'show mac address-table',look:'Where each of those MACs lives. One is on the printer\'s port; the other is on Gi0/14, the Facilities IoT port.',why:'The switch table turns a MAC into a port, and a port into a device on the patch list.'},

  done:'Duplicate addresses rarely fail outright; they flicker. The timeline in the request (new device yesterday) was the shortcut.'}

function L(k){ var g=K.glossary[k]; if(!g) return k; return plainOn()? g[1] : g[0]+' · '+g[1]; }
function Lf(k){ var g=K.glossary[k]; return g?(plainOn()? g[1] : g[0]):k; }
function school(k){ var s=K.schools[k]; return plainOn()? s[1] : s[0]+' · '+s[1]; }
function skillName(k){ var s=K.schools[k]; return s?(plainOn()?s[1]:s[0]):k; }
function qTitle(q){ return plainOn()? q.title : q.flavor+' — '+q.title; }
function qById(id){ return K.quests.filter(function(q){return q.id===id;})[0]||badById(id); }
function badById(id){ return (K.badTickets||[]).filter(function(b){ return b.id===id; })[0]; }
function realDone(){ return Object.keys(S.done).filter(function(id){ return !badById(id); }).length; }
function clampRep(v){ return Math.max(0,Math.min(100,Math.round(v))); }
/* bad tickets are woven in: about one for every four real tickets resolved (~20% of incoming), picked at random per player */
function badVisible(){ var pool=(K.badTickets||[]).filter(function(b){ return eraOpen(K.eras[b.era-1]); }); if(!S.os.badAt) S.os.badAt={};
  var shown=pool.filter(function(b){ return S.os.badAt[b.id]||S.done[b.id]||(S.active&&S.active.qid===b.id); }); var want=Math.floor(realDone()/4)+1, rest=pool.filter(function(b){ return shown.indexOf(b)<0; }), k=0, dirty=false;
  while(shown.length<want&&rest.length){ var i=(C.util.fnv((S.os.user||'x')+':'+shown.length)>>>0)%rest.length; var b=rest.splice(i,1)[0]; S.os.badAt[b.id]=Date.now()+(k++); shown.push(b); dirty=true; }
  if(dirty) save(); return shown; }
/* Night Watch: on about 4 nights in 10 the nightly ticket is a bad ticket instead of a hex */
function nightCopy(b){ return Object.assign({},b,{id:'NW-'+b.id,baseId:b.id,watch:true}); }
function nightHex(t){ var n=C.dayNumber(t||Date.now()); var pool=(K.badTickets||[]).filter(function(b){ return eraOpen(K.eras[b.era-1]); }); if(pool.length&&(C.util.fnv('nw'+n)>>>0)%10<4) return nightCopy(pool[(C.util.fnv('nwp'+n)>>>0)%pool.length]); return C.watchFor(K,t||Date.now()); }
function xpOf(k){ return S.xp[k]||0; }
/* promotion gates: XP and practicals, plus the fading rule: a faded rune in a gated school's exam domain holds the promotion.
   Ranks never drop once earned (S.rank), so eras and tickets do not vanish while runes fade. */
function objCmp(a,b){ var x=a.split('.').map(Number), y=b.split('.').map(Number); return x[0]-y[0]||x[1]-y[1]; }
function schoolDomain(k){ return String((K.schools[k]||[])[1]||'').split('.')[0]; }
function fadingIn(k,now){ var d=schoolDomain(k), t=now||Date.now(); return Object.keys(S.runes||{}).filter(function(o){ return o.split('.')[0]===d&&C.rune.state(S.runes[o],t)==='fading'; }).sort(objCmp); }
function allFading(){ var now=Date.now(); return Object.keys(S.runes||{}).filter(function(o){ return C.rune.state(S.runes[o],now)==='fading'; }).sort(objCmp); }
function gateMet(r,noFade){ if(!r.gate) return true; if(r.gate.locked) return false; var ok=true; Object.keys(r.gate.xp||{}).forEach(function(k){ if(xpOf(k)<r.gate.xp[k]) ok=false; if(!noFade&&fadingIn(k).length) ok=false; }); (r.gate.quests||[]).forEach(function(id){ if(!S.done[id]) ok=false; }); return ok; }
function rawRank(noFade,from){ var i=from||0; for(var k=i+1;k<K.ranks.length;k++){ if(gateMet(K.ranks[k],noFade)) i=k; else break; } return i; }
function rankIdx(){ return rawRank(false,S.rank||0); }
function blockedBy(){ var r=K.ranks[rankIdx()+1]; if(!r||!r.gate||r.gate.locked||!gateMet(r,true)) return []; var out=[]; Object.keys(r.gate.xp||{}).forEach(function(k){ fadingIn(k).forEach(function(o){ if(out.indexOf(o)<0) out.push(o); }); }); return out.sort(objCmp); }
function promoNote(i){ var r=K.ranks[i]; notify({title:S.plain?'Promoted!':'Trial of the Circle passed',body:'You are now '+rankName(r)+' ('+r.salary+'). '+r.realm+'.',app:'skills',icon:'skills'}); }
function checkPromotion(){ var r=rankIdx(); if(r>(S.rank||0)){ S.rank=r; promoNote(r); checkNewMail(true); save(); } }
function rankName(r){ return plainOn()? r.job : r.tier+' · '+r.job; }
function eraOpen(e){ var need=K.ranks.findIndex(function(r){return r.key===e.rank;}); return rankIdx()>=need; }
function totalXp(){ return Object.keys(S.xp).reduce(function(a,k){return a+S.xp[k];},0); }
function visibleQuests(){ return K.quests.filter(function(q){ return eraOpen(K.eras[q.era-1]); }); }
function questFor(a){ if(a&&a.baseId){ var bb=badById(a.baseId); return bb?C.effQuest(nightCopy(bb),a.unlocked):null; } if(a&&badById(a.qid)) return C.effQuest(badById(a.qid),a.unlocked); if(a&&a.tplId){ var t=K.watch.filter(function(x){return x.id===a.tplId;})[0]; return t?C.instantiate(t,a.varIdx):null; } return a?qById(a.qid):null; }
function addXp(k,v,why){ if(!v) return; S.xp[k]=(S.xp[k]||0)+v; emit('xp',{k:k,v:v,why:why}); }
function fromName(rep){ return String(rep||'').split(' · ')[0]; }
function firstName(rep){ return (String(rep||'').split(/[ (·]/)[0])||'there'; }
function addrOf(rep){ return firstName(rep).toLowerCase().replace(/[^a-z]/g,'')+'@spire.local'; }
function topoName(q){ var t=q&&K.topologies[q.topology]; return t?t.name:''; }
var HCOST={1:.05,2:.10,3:.20,4:.50};
function startQuest(q,o){ if(typeof q==='string') q=qById(q); if(!q) return; o=o||{}; quest=q; net=C.questNet(K,q); S.active={qid:q.id,start:Date.now(),hints:[],checks:0,dev:q.start,solved:false,cmds:[],last:null,tplId:q.tplId||null,varIdx:q.varIdx||0,baseId:q.baseId||null,looked:false,log:[],unlocked:false}; save(); emit('net',{fresh:true,silent:!!o.silent}); emit('quest',{}); }
function resetQuest(){ if(!quest) return; net=C.questNet(K,quest); S.active.solved=false; S.active.last=null; S.active.hinted=false; save(); emit('net',{reset:true}); emit('quest',{}); }
function grim(kind,text){ var last=S.grim[S.grim.length-1]; var qid=quest?quest.id:''; if(last&&last.text===text&&last.q===qid){ last.n=(last.n||1)+1; return; } S.grim.push({t:Date.now(),q:qid,kind:kind,text:text,note:''}); if(S.grim.length>300) S.grim.shift(); }
function revealHint(t){ var a=S.active; if(!a||a.hints.indexOf(t)>=0) return; a.hints.push(t); if(t>=3&&quest) questCardsFor(quest.id,0); grim('hint',(S.plain?'Used hint ':'Used whisper ')+t+(t===4?' (full commands): review this one later':'')); save(); emit('quest',{}); }
function hintText(q,t){ if(t<4) return q.hints[t-1]; if(!q.solution) return q.act||''; return q.solution.map(function(s){ return 'On '+s.dev+':\n'+s.lines.map(function(l){return '  '+(l===''?'(press Enter)':l);}).join('\n'); }).join('\n\n'); }
function testFix(){ return (net&&quest)?C.grade(net,quest):null; }
function doCheck(){ if(!net||!quest) return null; var g=C.grade(net,quest); S.active.checks++; S.active.last=g.results;
  if(!g.pass){ grim('check','Failed: '+g.results.filter(function(r){return !r.ok;}).map(function(r){return r.label;}).join('; ')); if(S.active.checks>=2) questCardsFor(quest.id,0); save(); emit('quest',{}); return g; }
  complete(g); return g; }
function complete(g,o){ if(MODE==='academy') return completeAcademy(g,o); var a=S.active, q=quest; if(!a||a.solved) return; o=o||{}; var mul=o.mul==null?1:o.mul, repD=o.rep==null?2:o.rep;
  var before=rankIdx(); var pen=Math.min(.85,(a.hints||[]).reduce(function(s,t){return s+HCOST[t];},0)); var inTime=(Date.now()-a.start)<=q.sla*60000; var replay=!q.watch&&!!S.done[q.id]; var styleB=(g.style||[]).length&&g.style.every(function(r){return r.ok;})?1.1:1;
  var got={}, tot=0; Object.keys(q.xp).forEach(function(k){ var v=Math.round(q.xp[k]*(1-pen)*(inTime?1.2:1)*(replay?.25:1)*styleB*mul); got[k]=v; tot+=v; addXp(k,v,q.id); });
  S.rep=clampRep((S.rep==null?50:S.rep)+repD);
  if(q.watch){ watchToday().hex=true; } else { if(!replay) S.done[q.id]={at:Date.now(),xp:tot,hints:(a.hints||[]).length}; else S.done[q.id].replays=(S.done[q.id].replays||0)+1; questCardsFor(q.id,DAYMS); }
  var wm=q.watch?finishWatchIfReady():'';
  a.solved=true; a.result={got:got,tot:tot,inTime:inTime,pen:pen,replay:replay,style:styleB>1,watch:wm,mul:mul,rep:(o.repTot==null?repD:o.repTot),notes:o.notes||[]}; save();
  notify({title:(S.plain?'Ticket resolved · ':'Curse lifted · ')+q.id,body:'+'+tot+' XP'+(wm?' · '+wm:''),app:'mail',args:{id:q.id},icon:'check'});
  if(q.obj) C.rune.apply(S.runes,q.obj,C.rune.score({pass:true,pen:pen,late:!inTime}),Date.now());
  var after=rankIdx(); S.rank=Math.max(S.rank||0,after); if(after>before) promoNote(after);
  checkNewMail(); emit('quest',{}); }
/* triage actions on the active ticket: ask | user | team | merge | fix. Grading is pure (core.triage); this applies the result. */
function doTriage(act){ var a=S.active; if(!a||!quest||a.solved) return null; var ctx={log:a.log||[],changed:C.changedDevs(K,quest,net),unlocked:!!a.unlocked,asked:a.asked||[]}; var r=C.triage(K,quest,act,ctx); if(act.type==='ask'&&r.result!=='invalid') a.asked=(a.asked||[]).concat(act.asks);
  if(r.result==='invalid') return r; if(r.result==='grade'){ r.grade=doCheck(); return r; }
  if(r.result==='pass'){ complete({style:[]},{mul:r.xpMul,rep:r.rep,notes:r.notes}); return r; }
  S.rep=clampRep((S.rep==null?50:S.rep)+r.rep);
  if(r.result==='unlock'){ a.unlocked=true; quest=C.effQuest(quest,true); a.dev=quest.start; a.start=Date.now(); notify({title:'Details received · '+quest.id,body:'The real fault is now in scope. Investigate from '+quest.start+'.',app:'mail',args:{id:quest.id},icon:'mail'}); }
  if(r.result==='fail'||r.rep<0) grim('triage',quest.id+' '+act.type+': '+r.notes.join(' '));
  save(); emit('quest',{}); emit('mail',{}); return r; }
/* fading runes (spaced repetition lives in the core) */
function addCard(id,f,b,tag,dueIn,sp){ var now=Date.now(); var c=S.cards[id]; if(c){ if(dueIn===0&&c.due>now) c.due=now; return c; } c=C.srs.make(id,f,b,tag,now,dueIn||0); if(sp) c.sp=sp; S.cards[id]=c; return c; }
function questCardsFor(qid,dueIn){ var L2=K.questCards[qid]; if(!L2) return; L2.forEach(function(p,i){ addCard('q:'+qid+':'+i,p[0],p[1],qid,dueIn); }); save(); }
function unlockSpells(line){ var low=line.replace(/^\s*do\s+/i,'').trim(); K.spellbook.forEach(function(s,i){ if(!s[3]) return; try{ if(new RegExp(s[3],'i').test(low)&&!S.cards['s:'+i]) addCard('s:'+i,s[2]+' — which command?',s[0],'spell',DAYMS,s[1]); }catch(e){} }); }
function seedCards(){ if(Object.keys(S.cards).length) return; ['network','broadcast','hosts','mask','cidr'].forEach(function(k){ var d=K.drillCards[k]; addCard('d:'+k,d[0],d[1],'subnetting',0); }); }
function dueCount(){ return C.srs.due(S.cards,Date.now()).length; }
function fmtIvl(days){ if(days<1/24) return '10m'; if(days<1) return Math.round(days*24)+'h'; if(days<30) return Math.round(days)+'d'; return Math.round(days/30)+'mo'; }
/* Night Watch */
function watchToday(){ var k=todayKey(); if(!S.watch.today||S.watch.today.date!==k) S.watch.today={date:k,hex:false,runes:0,done:false}; return S.watch.today; }
function finishWatchIfReady(){ var t=watchToday(); if(t.done||!t.hex||t.runes<5) return ''; t.done=true; var y=todayKey(Date.now()-DAYMS); S.watch.streak= S.watch.last===y?S.watch.streak+1:(S.watch.last===t.date?S.watch.streak:1); S.watch.last=t.date; S.watch.best=Math.max(S.watch.best||0,S.watch.streak); addXp('fund',20,'Night Watch'); save();
  return (S.plain?'Daily challenge complete. Streak: ':'Night Watch complete. Streak: ')+S.watch.streak+' night'+(S.watch.streak===1?'':'s')+' (+20 XP)'; }
function streakLive(){ var t=watchToday(); if(t.done) return S.watch.streak; return S.watch.last===todayKey(Date.now()-DAYMS)?S.watch.streak:0; }
/* save codes (compatible with earlier builds) */
function exportCode(){ var cards={}; Object.keys(S.cards).forEach(function(k){ var c=S.cards[k]; cards[k]=[c.due,Math.round(c.ivl*1000)/1000,Math.round(c.ease*100)/100,c.reps,c.lapses,c.seen||0]; });
  var o={v:2,rep:S.rep,xp:S.xp,done:S.done,grim:S.grim.slice(-40),plain:S.plain,font:S.font,introDone:true,cards:cards,drill:S.drill,watch:{last:S.watch.last,streak:S.watch.streak,best:S.watch.best,today:S.watch.today},theme:S.theme,rank:S.rank||0,runes:S.runes||{},course:S.course,labCfg:S.labCfg,ui:S.ui,cmd:S.cmd}; var b=btoa(unescape(encodeURIComponent(JSON.stringify(o)))); return 'NMC2-'+(C.util.fnv(b)>>>0).toString(36)+'-'+b; }
function cardText(id){ var p=id.split(':'); if(p[0]==='q'){ var L2=K.questCards[p[1]]; var x=L2&&L2[+p[2]]; return x?{f:x[0],b:x[1],tag:p[1]}:null; } if(p[0]==='d'){ var d=K.drillCards[p[1]]; return d?{f:d[0],b:d[1],tag:'subnetting'}:null; } if(p[0]==='s'){ var s=K.spellbook[+p[1]]; return s?{f:s[2]+' — which command?',b:s[0],tag:'spell',sp:s[1]}:null; } return null; }
function rebuildCards(o){ var out={}; Object.keys(o).forEach(function(id){ var t=cardText(id), v=o[id]; if(!t||!Array.isArray(v)) return; var c=C.srs.make(id,t.f,t.b,t.tag,0,0); c.due=v[0]; c.ivl=v[1]; c.ease=v[2]; c.reps=v[3]; c.lapses=v[4]; c.seen=v[5]; if(t.sp) c.sp=t.sp; out[id]=c; }); return out; }
function importCode(code){ code=String(code).replace(/\s+/g,''); var m=code.match(/^NMC[12]-([0-9a-z]+)-([A-Za-z0-9+\/=]+)$/); if(!m) throw new Error('That is not a Netmancer save code.'); if((C.util.fnv(m[2])>>>0).toString(36)!==m[1]) throw new Error('The code is damaged (checksum mismatch). Copy it again in full.'); var o=JSON.parse(decodeURIComponent(escape(atob(m[2])))); if(!o||(o.v!==1&&o.v!==2)||typeof o.xp!=='object') throw new Error('Unsupported save version.'); return o; }
function applyImport(o){ S.xp=o.xp; if(o.rep!=null) S.rep=clampRep(o.rep); S.done=o.done||{}; S.grim=o.grim||[]; S.plain=!!o.plain; S.font=o.font||13; if(o.drill) S.drill=o.drill; if(o.watch) S.watch=o.watch; if(o.cards) S.cards=rebuildCards(o.cards); S.runes=o.runes&&typeof o.runes==='object'?o.runes:{}; if(!o.runes) seedRunes(S,Date.now()); S.rank=o.rank!=null?o.rank:rawRank(true,0); if(o.course&&typeof o.course==='object') S.course=Object.assign(fcourse(),o.course); if(o.labCfg) S.labCfg=o.labCfg; if(o.ui) S.ui=o.ui; if(o.cmd&&o.cmd.cards) S.cmd=o.cmd; if(o.theme) applyTheme(o.theme); setFont(S.font); checkNewMail(true); saveNow(); emit('quest',{}); emit('plain',{}); }

/* ---------- Academy (training mode) ----------
   Director: builds a pickTicket request from the shared runes (weak areas, a blueprint-weighted mixed
   set, or chosen objectives). Completing a ticket here updates runes and cards only: no XP, reputation,
   rank, Mail or Night Watch. The career's open ticket is stashed and its SLA clock pauses. */
var AC={view:'home',sel:[]}, acTerm=null, OBJS=null;
function allObjs(){ if(OBJS) return OBJS; var o={}; C.pool(K).forEach(function(q){ if(!q.kind) (q.obj||[]).forEach(function(x){ o[x]=1; }); }); OBJS=Object.keys(o).sort(objCmp); return OBJS; }
function objLabel(o){ return o+' '+((K.objectives||{})[o]||''); }
function practiceBtn(q){ return q&&q.obj&&q.obj.length?'<p class="small"><button class="btn" data-a="academy">Practise '+esc(q.obj.join(', '))+' in the Academy</button></p>':''; }
function practiceInAcademy(objs){ enterAcademy({objectives:(objs||[]).slice()}); }
function enterAcademy(preset){ acFrom=shellBuilt?'career':'title'; if(shellBuilt){ saveNow(); WM.wins.slice().forEach(function(w){ closeWin(w.id); }); shellBuilt=false; }
  if(MODE!=='academy'){ careerStash=S.active; careerAway=Date.now(); MODE='academy'; S.active=S.academy.active||null; quest=null; net=null; restoreQuest(); }
  phase='academy'; locked=false; closePops(); WM.mode=isMobile()?'mobile':'desktop'; root.innerHTML=''; root.className='acroot'+(S.os.calm?' calm':''); acTerm=null; AC={view:S.active&&quest&&!S.active.solved?'run':'home',sel:[]};
  if(preset&&preset.objectives&&preset.objectives.length){ AC.sel=preset.objectives.slice(); startRun('pick',preset.objectives); return; } acRender(); }
function leaveAcademy(){ saveNow(); S.academy.active=S.active; S.active=careerStash; careerStash=null; MODE='career'; if(S.active&&!S.active.solved&&careerAway) S.active.start+=Date.now()-careerAway; careerAway=0;
  quest=null; net=null; acTerm=null; restoreQuest(); saveNow(); root.innerHTML=''; root.className=''; if(acFrom==='career') session(); else titleScreen(); }
function startRun(kind,objs){ var all=allObjs(), o=(objs&&objs.length?objs:all).filter(function(x){ return all.indexOf(x)>=0; }); if(!o.length) o=all; var snap={}; all.forEach(function(x){ snap[x]=S.runes[x]?S.runes[x].m:0; });
  S.academy.run={kind:kind,objs:kind==='pick'?o:all,n:kind==='mixed'?6:(kind==='weak'?5:3),i:0,seed:(Date.now()^Math.floor(Math.random()*1e9))>>>0,used:[],avoid:careerStash&&!careerStash.solved?[careerStash.qid]:[],done:[],snap:snap,startAt:Date.now(),endAt:kind==='mixed'?Date.now()+20*60000:null}; acNext(); }
function acReq(run){ var now=Date.now(), W; if(run.kind==='mixed'){ W={}; run.objs.forEach(function(o){ W[o]=(K.domainWeight||{})[o.split('.')[0]]||5; }); } else W=C.rune.weak(S.runes,run.objs,now);
  var cap=run.objs.reduce(function(m,o){ var r=S.runes[o]; return Math.max(m,(r&&r.tier)||1); },1); return {seed:(run.seed+run.i*7919)>>>0,objectives:run.objs,weights:W,tierRange:[1,Math.min(4,cap+1)],exclude:run.used.concat(run.avoid||[]),kinds:'real'}; }
function acNext(){ var run=S.academy.run; if(!run){ AC.view='home'; return acRender(); } var over=run.i>=run.n||(run.endAt&&Date.now()>run.endAt), rq=over?null:acReq(run), q=rq&&C.pickTicket(K,rq); if(!q&&rq&&(run.avoid||[]).length){ rq.exclude=run.used; q=C.pickTicket(K,rq); } /* the career's open ticket only when nothing else covers the objective */
  if(!q) return acFinish(); run.i++; run.used.push(q.tplId||q.id); startQuest(q,{silent:true}); AC.view='run'; acRender(); }
function acFinish(){ var run=S.academy.run; if(run){ S.academy.history.unshift({at:Date.now(),kind:run.kind,n:run.done.length,solved:run.done.filter(function(x){ return x.score>0; }).length}); S.academy.history=S.academy.history.slice(0,30); }
  AC.last=run; S.academy.run=null; S.active=null; quest=null; net=null; save(); AC.view='sum'; acRender(); }
function completeAcademy(g,o){ var a=S.active, q=quest; if(!a||a.solved) return; var pen=Math.min(.85,(a.hints||[]).reduce(function(x,t){ return x+HCOST[t]; },0)+.1*Math.min(3,Math.max(0,(a.checks||1)-1))), late=(Date.now()-a.start)>(q.sla||30)*60000, sc=C.rune.score({pass:true,pen:pen,late:late}), objs=q.obj||[], before={};
  objs.forEach(function(x){ before[x]=S.runes[x]?S.runes[x].m:0; }); C.rune.apply(S.runes,objs,sc,Date.now()); questCardsFor(q.id,DAYMS);
  a.solved=true; a.result={academy:true,score:sc,pen:pen,late:late,before:before}; var run=S.academy.run; if(run) run.done.push({id:q.id,score:sc,objs:objs}); save(); acRender(); }
function acSkip(){ var a=S.active, q=quest; if(q&&a&&!a.solved){ C.rune.apply(S.runes,q.obj||[],0,Date.now()); grim('skip','Skipped '+q.id+' in the Academy'); if(S.academy.run) S.academy.run.done.push({id:q.id,score:0,objs:q.obj||[],skipped:true}); } acNext(); }
function acTop(){ var has=!!(S.active&&quest); return '<div class="ac-top"><button type="button" class="btn ghost" data-ac="leave">'+svg('back')+(acFrom==='career'?'Back to career':'Title screen')+'</button><b class="ac-title">The Academy <small>training mode</small></b><nav class="ac-tabs" aria-label="Academy">'
  +[['home','Objectives'],['run','Ticket'],['practice','Drills &amp; cards']].map(function(t){ return '<button type="button" data-ac="v:'+t[0]+'" class="'+(AC.view===t[0]?'on':'')+'"'+(t[0]==='run'&&!has?' disabled':'')+'>'+t[1]+'</button>'; }).join('')+'</nav></div>'; }
