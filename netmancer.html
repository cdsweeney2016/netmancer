<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2b2140">
<title>Netmancer: A CCNA Wizard Career Sim (prototype)</title>
<style>
:root{color-scheme:light;--bg:#f5efe1;--card:#fffcf5;--ink:#2a2236;--muted:#6d6379;--line:#e3d9c4;--accent:#5a3d9e;--accent2:#7b5cc7;--gold:#a87b22;--ok:#2e7d4b;--bad:#b13e2c;--warn:#a96a12;--tbg:#16121d;--tfg:#ebe6f4;--tp:#cdb2ff;--terr:#ff9e8f;--tsys:#f2c66d;--tok:#93e2ad;--tmut:#9a91ab;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;--tfs:13px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit}
#app{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));background:#2b2140;color:#f7f0ff;flex:0 0 auto}
.brand{font-weight:700;letter-spacing:.3px;font-size:16px;white-space:nowrap}
.brand small{font-weight:400;opacity:.7;font-size:11px;margin-left:4px}
#rankchip{flex:1;min-width:0;font-size:12px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:#43345f;border:1px solid #5d4a82;border-radius:8px;padding:6px 10px;min-height:36px;font-size:13px;cursor:pointer;color:#f7f0ff;white-space:nowrap}
.hbtn[aria-pressed=true]{background:#e9dcff;color:#2b2140}
nav#tabs{display:flex;background:#3a2d55;flex:0 0 auto;overflow-x:auto}
nav#tabs button{flex:1;min-width:64px;background:none;border:0;color:#d9cdf0;padding:8px 4px;min-height:42px;font-size:13px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav#tabs button.on{color:#fff;border-bottom-color:#e2b86a;font-weight:600}
main{flex:1;min-height:0;display:flex;overflow:hidden}
#left{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px}
.view.on{display:block}
#view-term{padding:0;flex-direction:column;background:var(--tbg)}
#view-term.on{display:flex}
@media (max-width:899px){ main[data-view=term] #left{display:none} }
@media (min-width:900px){
  #left{flex:0 0 44%;max-width:640px;border-right:1px solid var(--line)}
  #view-term{display:flex!important;flex:1}
  nav#tabs button[data-view=term]{display:none}
  .mobile-only{display:none!important}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2,.card h3{margin:0 0 6px;font-size:17px}
.card h3{font-size:15px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:#efe6d2;color:#5a4a2a;margin:2px 4px 2px 0;white-space:nowrap}
.tag.v{background:#ece4fb;color:#4a3189}
.tag.ok{background:#dcf0e2;color:#1f5e37}
.tag.bad{background:#f8e0da;color:#8a2c1d}
.real{color:var(--muted);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid #c9b88f;background:#fff7e3;cursor:pointer;font-size:14px;margin:4px 6px 4px 0}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.qcard{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fffdf8;cursor:pointer;width:100%;text-align:left}
.qcard:hover{border-color:var(--accent2)}
.qcard.locked{opacity:.55;cursor:not-allowed}
.qcard .id{font:600 12px var(--mono);color:var(--accent);min-width:48px;padding-top:2px}
.qcard .t{font-weight:600}
.qcard .s{font-size:13px;color:var(--muted)}
.qcard .st{margin-left:auto;font-size:18px;min-width:22px;text-align:right}
.era{margin-top:6px}
.era h3{margin:10px 0 2px;font-size:15px}
.ticket{white-space:pre-wrap}
.checks{list-style:none;padding:0;margin:6px 0}
.checks li{padding:4px 0;font-size:14px;display:flex;gap:6px}
.checks li .i{min-width:18px;font-weight:700}
.checks li.ok .i{color:var(--ok)} .checks li.bad .i{color:var(--bad)}
.hint{border-left:3px solid var(--gold);background:#fbf3df;padding:8px 10px;border-radius:6px;margin:6px 0;font-size:14px;white-space:pre-wrap}
.hint code,.mono{font-family:var(--mono);font-size:13px}
code{font-family:var(--mono);font-size:.92em;background:#f1e9d8;padding:0 4px;border-radius:4px}
.bar{height:8px;background:#eadfca;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--gold))}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
textarea,input.txt{width:100%;font:13px var(--mono);border:1px solid #cdbf9f;border-radius:8px;padding:8px;background:#fff}
/* terminal */
.termbar{display:flex;gap:6px;align-items:center;padding:6px 8px;background:#221b2e;color:var(--tfg);flex:0 0 auto;flex-wrap:wrap}
.termbar select{background:#2f2640;color:var(--tfg);border:1px solid #4b3d66;border-radius:8px;min-height:36px;font-size:14px;max-width:46vw;padding:0 6px}
#modeBadge{font-size:12px;color:var(--tp);flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{background:#3a2f50;border:1px solid #56477a;color:var(--tfg);border-radius:8px;min-height:36px;padding:4px 10px;font-size:13px;cursor:pointer}
.tbtn.pri{background:#7b5cc7;border-color:#9a7ee0;color:#fff;font-weight:600}
#out{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 10px 14px;font:var(--tfs)/1.35 var(--mono);color:var(--tfg);white-space:pre;overscroll-behavior:contain;outline:none}
#out .e{color:var(--terr)} #out .y{color:var(--tsys)} #out .p{color:var(--tp)} #out .g{color:var(--tok)} #out .m{color:var(--tmut)} #out .b{color:#fff;font-weight:700}
#out .blk{white-space:pre-wrap;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;border:1px solid #3b3150;border-radius:8px;padding:8px 10px;margin:6px 0;background:#1e1828}
#quick{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:#1c1726;flex:0 0 auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#quick::-webkit-scrollbar{display:none}
#quick button{flex:0 0 auto;background:#2f2640;border:1px solid #4b3d66;color:var(--tfg);border-radius:8px;min-height:40px;min-width:44px;padding:4px 11px;font:13px var(--mono);cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#quick button.k{background:#3d2f59;color:var(--tp)}
#inForm{display:flex;align-items:center;gap:6px;padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom));background:#221b2e;flex:0 0 auto}
#promptEl{font:13px var(--mono);color:var(--tp);max-width:48%;overflow:hidden;white-space:nowrap;flex:0 1 auto}
@media (max-width:600px){ #fontDn,#fontUp{display:none} .termbar{flex-wrap:nowrap} #modeBadge{min-width:0;font-size:11px} .termbar select{max-width:44vw} }
#cmd{flex:1;min-width:0;font:16px var(--mono);background:#120f18;color:#fff;border:1px solid #4b3d66;border-radius:8px;padding:8px;min-height:44px;outline:none}
#cmd:focus{border-color:#9a7ee0}
#sendBtn{min-width:48px;min-height:44px}
/* map */
svg.topo{width:100%;height:auto;background:#fffdf7;border:1px solid var(--line);border-radius:12px;touch-action:manipulation}
svg.topo .node{cursor:pointer}
svg.topo text{font:11px system-ui,sans-serif;fill:#2a2236}
svg.topo .pl{font:9px var(--mono);fill:#6d6379;paint-order:stroke;stroke:#fffdf7;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:12px}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(20,14,30,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
#modal[hidden]{display:none}
#modal .box{background:var(--card);border-radius:14px;max-width:560px;width:100%;max-height:88%;overflow:auto;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#modal h2{margin:0 0 8px}
.grim{border-bottom:1px solid var(--line);padding:8px 0}
.grim .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
nav#tabs button{min-width:56px;font-size:12.5px}
.bigq{font-size:20px;font-weight:600;line-height:1.3;margin:10px 0 14px;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:56px;border-radius:12px;border:1px solid #c9b88f;background:#fffaf0;font:600 17px var(--mono);cursor:pointer;padding:8px;touch-action:manipulation}
.opt.ok{background:#dcf0e2;border-color:#2e7d4b} .opt.bad{background:#f8e0da;border-color:#b13e2c}
.tbar{height:10px;background:#eadfca;border-radius:6px;overflow:hidden;margin:6px 0} .tbar>i{display:block;height:100%;background:linear-gradient(90deg,#b13e2c,#a87b22,#2e7d4b);transition:width .2s linear}
.stat{display:inline-block;min-width:70px;text-align:center;padding:6px 8px;border-radius:10px;background:#f1e9ff;margin:0 6px 6px 0;font-size:13px} .stat b{display:block;font-size:20px}
.rune{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fffdf8;min-height:120px;font-size:17px;white-space:pre-wrap}
.rune .ans{border-top:1px dashed #cdbf9f;margin-top:12px;padding-top:12px;font-family:var(--mono);font-size:15px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px} .grades button{min-height:54px;border-radius:12px;border:1px solid #c9b88f;background:#fff7e3;font-size:14px;cursor:pointer} .grades small{display:block;color:var(--muted);font-size:11px}
.step{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)} .step .n{width:28px;height:28px;border-radius:50%;background:#ece4fb;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto} .step.done .n{background:#dcf0e2;color:#1f5e37}
.sp{flex:1}
</style>

 --hdr:#080918;--hdrfg:#e9e7ff;--hbtn:#1c1f48;--hbtnline:#3a3f86;--tab:#080918;--tabfg:#b9bbe6;--tabon:#fff;--tabbar:#a99dff;--btn:#1d2049;--btnline:#3a3f86;--qbg:#1a1c43;--hintbg:#1c1f4a;--codebg:#262a5c;--barbg:#262a5c;--statbg:#20234f;

 --tbg:#0c0a09;--tfg:#f2e8d8;--tp:#ffb46b;--terr:#ff9884;--tsys:#ffd57a;--tok:#a2e8ac;--tmut:#ab9c8c;--tchrome:#16120f;--tchrome2:#110e0c;--tline:#3f3229;--tbtn:#221b17;--tkey:#2f2219;--cmdbg:#070605;--tblk:#17120f;
 --mapbg:#1a1512;--lk-up:#6fcb8a;--lk-tr:#f0a050;--lk-warn:#ffd166;--lk-adm:#ff7d66;--lk-down:#8f8173;--hfont:Georgia,"Palatino Linotype","Book Antiqua",serif;--onwood:var(--ink)}

/* ---- shared component mapping for every theme ---- */
html[data-theme] body{background:var(--bg);color:var(--ink)}
html[data-theme] header{background:var(--hdr);color:var(--hdrfg)}
html[data-theme] .hbtn{background:var(--hbtn);border-color:var(--hbtnline);color:var(--hdrfg)}
html[data-theme] .hbtn[aria-pressed=true]{background:var(--hdrfg);color:var(--hdr)}
html[data-theme] nav#tabs{background:var(--tab)}
html[data-theme] nav#tabs button{color:var(--tabfg)}
html[data-theme] nav#tabs button.on{color:var(--tabon);border-bottom-color:var(--tabbar)}
html[data-theme] .card{background:var(--card);border-color:var(--line);color:var(--ink)}
html[data-theme] .card h2,html[data-theme] .card h3,html[data-theme] .brand,html[data-theme] #modal h2,html[data-theme] .era h3{font-family:var(--hfont)}
html[data-theme] .tag{background:var(--tag);color:var(--tagfg)}
html[data-theme] .tag.v{background:var(--tagv);color:var(--tagvfg)}
html[data-theme] .tag.ok{background:var(--okbg);color:var(--okfg)}
html[data-theme] .tag.bad{background:var(--badbg);color:var(--badfg)}
html[data-theme] .btn{background:var(--btn);border-color:var(--btnline);color:var(--ink)}
html[data-theme] .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
html[data-theme] .btn.ghost{background:transparent}
html[data-theme] .qcard{background:var(--qbg);border-color:var(--line);color:var(--ink)}
html[data-theme] .qcard .id{color:var(--accent2)}
html[data-theme] .qcard:hover{border-color:var(--accent2)}
html[data-theme] .hint{background:var(--hintbg);border-left-color:var(--gold);color:var(--ink)}
html[data-theme] code{background:var(--codebg);color:var(--ink)}
html[data-theme] .bar,html[data-theme] .tbar{background:var(--barbg)}
html[data-theme] textarea,html[data-theme] input.txt,html[data-theme] select.sel{background:var(--inbg);color:var(--ink);border-color:var(--btnline)}
html[data-theme] .termbar,html[data-theme] #inForm{background:var(--tchrome)}
html[data-theme] .termbar select{background:var(--tbtn);color:var(--tfg);border-color:var(--tline)}
html[data-theme] .tbtn{background:var(--tbtn);border-color:var(--tline);color:var(--tfg)}
html[data-theme] .tbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
html[data-theme] #view-term{background:var(--tbg)}
html[data-theme] #out .blk{background:var(--tblk);border-color:var(--tline)}
html[data-theme] #quick{background:var(--tchrome2)}
html[data-theme] #quick button{background:var(--tbtn);border-color:var(--tline);color:var(--tfg)}
html[data-theme] #quick button.k{background:var(--tkey);color:var(--tp)}
html[data-theme] #cmd{background:var(--cmdbg);border-color:var(--tline);color:var(--tfg)}
html[data-theme] #cmd:focus{border-color:var(--tp)}
html[data-theme] #left{border-right-color:var(--line)}
html[data-theme] svg.topo{background:var(--mapbg);border-color:var(--line)}
html[data-theme] svg.topo text.dl,html[data-theme] svg.topo .pl{fill:var(--muted);stroke:var(--mapbg)} #os.labroot .topo .pl{fill:#a3afbc;stroke:#10151c} #os.labroot .topo .dl{fill:#a3afbc}
html[data-theme] svg.topo .lk[data-c="#2e7d4b"]{stroke:var(--lk-up)}

html[data-theme] .opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--okfg)}
html[data-theme] .opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--badfg)}

function instantiate(tpl,k){ var v=tpl.vars[((k%tpl.vars.length)+tpl.vars.length)%tpl.vars.length]; var s=JSON.stringify(tpl,function(key,val){ return key==='vars'?undefined:val; }).replace(/\{\{(\w+)\}\}/g,function(m,n){ return v[n]!==undefined?String(v[n]):m; }); var q=JSON.parse(s); q.id='NW-'+tpl.id+'-'+(k%tpl.vars.length); q.tplId=tpl.id; q.varIdx=k%tpl.vars.length; q.watch=true; return q; }

/* ---- rune puzzles: subnetting drills (pure, seeded) ---- */

function adapt(st,correct){ st=Object.assign({level:1,run:0,miss:0},st); if(correct){ st.run++; st.miss=0; if(st.run>=3&&st.level<4){ st.level++; st.run=0; } } else { st.run=0; st.miss++; if(st.miss>=2&&st.level>1){ st.level--; st.miss=0; } } return st; }

/* ---- fading runes: spaced repetition (simplified SM-2) ---- */
var DAYMS=86400000;
function srsNew(id,f,b,tag,now,dueIn){ return {id:id,f:f,b:b,tag:tag||'',due:now+(dueIn||0),ivl:0,ease:2.5,reps:0,lapses:0,seen:0}; }
function srsReview(c,grade,now){ c=Object.assign({},c); c.seen=(c.seen||0)+1;
  if(grade===0){ c.lapses++; c.reps=0; c.ease=Math.max(1.3,c.ease-0.2); c.ivl=0; c.due=now+10*60000; return c; }
  if(c.reps===0) c.ivl= grade===1?0.5:(grade===2?1:3); else if(c.reps===1) c.ivl= grade===1?Math.max(1,c.ivl*1.2):(grade===2?3:6); else c.ivl= grade===1?c.ivl*1.2:(grade===2?c.ivl*c.ease:c.ivl*c.ease*1.3);

function testQuest(content,q){ var r={id:q.id,ok:true,notes:[],wrong:0};
    try{ var n0=questNet(content,q); if(grade(n0,q).pass){ r.ok=false; r.notes.push('already passes before any fix'); }
      var n1=questNet(content,q); var s=runScript(n1,q.solution); if(s.errs.length){ r.ok=false; r.notes.push('solution syntax: '+s.errs.join(' | ')); } var g=grade(n1,q); if(!g.pass){ r.ok=false; r.notes.push('solution fails: '+g.results.filter(function(x){return !x.ok;}).map(function(x){return x.label;}).join('; ')); }
      (q.alt||[]).forEach(function(alt,k){ var na=questNet(content,q); var sa=runScript(na,alt); if(sa.errs.length){ r.ok=false; r.notes.push('alt '+k+' syntax: '+sa.errs.join(' | ')); } if(!grade(na,q).pass){ r.ok=false; r.notes.push('alt solution '+k+' fails: '+grade(na,q).results.filter(function(x){return !x.ok;}).map(function(x){return x.label;}).join('; ')); } });
      (q.wrong||[]).forEach(function(w){ var nw=questNet(content,q); var sw=runScript(nw,w.steps); if(sw.errs.length && !w.expectErr){ r.ok=false; r.notes.push('wrong-case syntax: '+sw.errs.join(' | ')); } r.wrong++; if(grade(nw,q).pass){ r.ok=false; r.notes.push('WRONG FIX PASSED: '+w.why); } });
      var ss=serializeNet(n1); var n2=loadNet(ss); if(!grade(n2,q).pass){ r.ok=false; r.notes.push('save/load round-trip lost the fix'); }
    }catch(e){ r.ok=false; r.notes.push('exception: '+e.message); }
    return r; }
function testDrills(){ var errs=[], n=0;
  for(var lv=1;lv<=4;lv++){ ['sprint','match'].forEach(function(mode){ var R=rng(1000*lv+mode.length); for(var k=0;k<250;k++){ var q=drillQ(lv,R,mode); n++;
    if(q.opts.length<2) errs.push('too few options: '+q.prompt); if(q.opts.filter(function(o){return o===q.answer;}).length!==1) errs.push('answer not exactly once: '+q.prompt);
    if(new Set(q.opts).size!==q.opts.length) errs.push('duplicate options: '+q.prompt);
    var oct=q.ip.split('.').map(Number), bits=q.len, mk=[0,0,0,0].map(function(_,i){ var b=Math.max(0,Math.min(8,bits-8*i)); return (256-Math.pow(2,8-b))&255; }); var net=oct.map(function(o,i){return o&mk[i];}), bc=oct.map(function(o,i){return (o&mk[i])|(255-mk[i]);});

var TRI={xpVerified:1.2,xpUnverified:0.5,xpChanged:0.5,repPass:3,repVerified:2,repUnverified:-5,repChanged:-10,repWrong:-3,repMislead:-8,repAlready:-5,repPw:-10,repFiller:-2,repGoodAsk:2};

function logMatch(log,v){ var re=new RegExp(v.re,'i'); return (log||[]).some(function(c){ return c[0]===v.dev&&re.test(String(c[1]).trim()); }); }
function changedDevs(content,q,net){ var base=questNet(content,q), out=[]; devs(net).forEach(function(d){ var b=base.devices[d.id]; if(!b||d.locked) return;

  var short=function(id){ return (T.asks[id]&&T.asks[id].short)||id; };

  function closeOk(){ rep+=TRI.repPass; if(needsV){ if(verified){ mul*=TRI.xpVerified; rep+=TRI.repVerified; notes.push('Checked before acting: +20% XP.'); } else { mul*=TRI.xpUnverified; rep+=TRI.repUnverified; notes.push('Closed without verifying. '+(q.verifyHint||'Run one quick check that proves the cause before you close.')); } }

 {id:'T-001',era:1,topology:'ground',flavor:'The Lost Lamp',title:'New laptop, no internet',tier:1,xp:{fund:100},obj:['1.4','1.10'],sla:6,reporter:'Jordan (Sales) · flustered',start:'LAPTOP-7',

 {id:'T-002',era:1,topology:'ground',flavor:'The Nameless Road',title:'Websites dead, chat app works',tier:1,xp:{fund:100},obj:['1.10','4.3'],sla:6,reporter:'Dana (Accounting) · confused',start:'PC-DANA',

  brief:'You start on PC-DANA. The office DNS server is SRV-1 (10.10.10.5). An old DNS server, 10.10.10.53, was retired last month.',

  hints:['Reaching 8.8.8.8 by number but not by name says something about the service that turns names into numbers.','On PC-DANA: ipconfig /all and read "DNS Servers". Then try nslookup intranet.netmancer.local.','DNS servers normally arrive with the DHCP lease. A statically typed DNS server overrides DHCP and stays forever, even after the server it points to is retired. Point the client at 10.10.10.5, or hand DNS back to DHCP (netsh interface ip set dns "Ethernet" dhcp).'],
  solution:[{dev:'PC-DANA',lines:['netsh interface ip set dns "Ethernet" static 10.10.10.5']}],
  alt:[[{dev:'PC-DANA',lines:['powershell','Set-DnsClientServerAddress -InterfaceAlias "Ethernet" -ServerAddresses 10.10.10.5']}],[{dev:'PC-DANA',lines:['netsh interface ip set dns "Ethernet" dhcp']}]],
  wrong:[{why:'pointed DNS at the router (10.10.10.1), which is not a DNS server',steps:[{dev:'PC-DANA',lines:['netsh interface ip set dns "Ethernet" static 10.10.10.1']}]},{why:'pointed DNS at a public resolver, which cannot resolve the intranet',steps:[{dev:'PC-DANA',lines:['netsh interface ip set dns "Ethernet" static 8.8.8.8']}]}],
  debrief:{curse:'PC-DANA had a static DNS server (10.10.10.53) that no longer exists.',concept:'IP connectivity and name resolution are separate. ping by IP tests routing; nslookup tests DNS. A public resolver cannot answer for internal names like intranet.netmancer.local.',real:'Static DNS entries left over from old projects or VPN tools are a classic helpdesk ticket. Prefer DHCP-provided DNS unless there is a reason.'}},
 {id:'T-003',era:1,topology:'ground',flavor:'The Wrong Door',title:'New PC reaches the printer but not the internet',tier:1,xp:{fund:100},obj:['1.6','1.10'],sla:6,reporter:'Sam (Desk 7) · patient',start:'PC-NEW',

  success:[R('PC-NEW','8.8.8.8',0,'the internet (8.8.8.8)'),R('PC-NEW','93.184.216.34',443,'www.example.com')],

  hints:['Things in the same subnet work, things beyond it do not. Which setting is only used for leaving the subnet?','On PC-NEW: ipconfig and compare the Default Gateway with the IPv4 address and mask. tracert 8.8.8.8 shows where it stops.','A default gateway must be inside your own subnet. 10.10.1.1 is outside 10.10.10.0/24, so the PC can never ARP for it. Keep the static IP and fix the gateway: netsh interface ip set address "Ethernet" static <ip> <mask> <gateway>.'],
  solution:[{dev:'PC-NEW',lines:['netsh interface ip set address "Ethernet" static 10.10.10.57 255.255.255.0 10.10.10.1']}],

  wrong:[{why:'switched the PC to DHCP and lost its reserved address',steps:[{dev:'PC-NEW',lines:['netsh interface ip set address "Ethernet" dhcp']}]},{why:'used the switch management IP as the gateway',steps:[{dev:'PC-NEW',lines:['netsh interface ip set address "Ethernet" static 10.10.10.57 255.255.255.0 10.10.10.2']}]}],
  debrief:{curse:'Default gateway typo: 10.10.1.1 instead of 10.10.10.1.',concept:'Hosts deliver directly inside their subnet (ARP for the target) and send everything else to the default gateway, which must be a router interface in the same subnet.',real:'Static addressing tickets almost always come down to mask, gateway or DNS. Read all three before touching anything.'}},
 {id:'T-006',era:1,topology:'ground',flavor:'The Stuttering Scribe',title:'Slow network at one desk',tier:2,xp:{fund:150},obj:['1.4'],sla:10,reporter:'Lee (Accounting) · irritated',start:'PC-ACCT',
  symptom:'"My downloads crawl and file copies to the share take forever. Everyone else in Accounting is fine. Pings look normal, so it can\'t be the network, right?"',
  brief:'PC-ACCT is patched to SW1 Gi0/8. The PC NIC is left on auto-negotiation (company standard).',
  faults:{SW1:['interface g0/8','speed 100','duplex full']},
  success:[{type:'link_full',dev:'SW1',if:'g0/8'}],
  constraints:[R('PC-ACCT','10.10.10.5',445,'SRV-1 file share')],
  hints:['Pings are tiny. Big transfers fail when both ends disagree about who may talk when.','On SW1: show interfaces status (look at Duplex/Speed for Gi0/8, "a-" means negotiated), then show interfaces g0/8 and read the error counters.','If one side is hard-coded (speed 100 / duplex full) it stops auto-negotiating, so the auto side falls back to half duplex: a duplex mismatch. The full side logs CRC errors and runts, the half side late collisions. Put the switch port back to speed auto and duplex auto (or no speed / no duplex).'],
  solution:[{dev:'SW1',lines:['enable','configure terminal','interface g0/8','speed auto','duplex auto','end']}],
  alt:[[{dev:'SW1',lines:['en','conf t','int g0/8','no speed','no duplex','end']}]],
  wrong:[{why:'set duplex half (both ends match but at half duplex)',steps:[{dev:'SW1',lines:['en','conf t','int g0/8','duplex half','end']}]},{why:'reset duplex only while speed stays hard-coded',steps:[{dev:'SW1',lines:['en','conf t','int g0/8','duplex auto','end']}]}],
  debrief:{curse:'Duplex mismatch: SW1 Gi0/8 hard-set to 100/full while the PC auto-negotiated to half.',concept:'Auto-negotiation only works if both ends negotiate. A hard-coded side sends no negotiation, so the other side picks half duplex. Symptoms: CRC/runts on the full side, late collisions on the half side, small pings fine, bulk transfers slow.',real:'Usually left over from someone "fixing" an old device by forcing speed. Leave both ends on auto unless you hard-code both ends identically.'}},

  hosts:{'THERMO-1':{ip:'10.10.10.40',gw:'10.10.10.1',dns:['10.10.10.5']}},
  success:[{type:'unique_ip',net:'10.10.10.0/24'},R('PC-DANA','10.10.10.40',9100,'PRN-1 print queue')],
  constraints:[{type:'host_ip',host:'PRN-1',ip:'10.10.10.40'},R('THERMO-1','10.10.10.1',0,'its gateway (thermostat stays online)')],
  hints:['If two devices answer to the same name, whoever shouts last wins.','On PC-DANA run arp -a after pinging 10.10.10.40 and look at the MAC address vendor prefix. On SW1, show mac address-table tells you which port that MAC lives on.','A duplicate IPv4 address makes ARP flip between two MACs, so traffic goes to whichever answered last. Find the intruder (the MAC on Gi0/14, the Facilities IoT port) and move it: on THERMO-1, remove the address with sudo ip addr del 10.10.10.40/24 dev eth0, then give it a new one (sudo dhclient eth0, or a free static address plus a default route).'],
  solution:[{dev:'THERMO-1',lines:['sudo ip addr del 10.10.10.40/24 dev eth0','sudo dhclient eth0']}],
  alt:[[{dev:'THERMO-1',lines:['sudo ip addr del 10.10.10.40/24 dev eth0','sudo ip addr add 10.10.10.46/24 dev eth0','sudo ip route add default via 10.10.10.1']}]],
  wrong:[{why:'added a second address but left the duplicate in place',steps:[{dev:'THERMO-1',lines:['sudo ip addr add 10.10.10.46/24 dev eth0']}]},{why:'tried to change the address without sudo',expectErr:true,steps:[{dev:'THERMO-1',lines:['ip addr del 10.10.10.40/24 dev eth0']}]}],
  debrief:{curse:'THERMO-1 was statically configured with the printer\'s address, 10.10.10.40.',concept:'ARP maps an IPv4 address to one MAC. With a duplicate, the mapping flips between devices; pings may still succeed (both reply), but TCP sessions like printing break.',real:'IoT installers often copy an "example" IP from a manual. A DHCP reservation, or a clear static range, prevents it.'}},
 {id:'T-013',era:2,topology:'closet',flavor:'The Wrong Hall',title:'New hire on the wrong network',tier:2,xp:{access:150},obj:['2.1'],sla:10,reporter:'Alex (new hire) · polite',start:'NEWHIRE',
  symptom:'"Hi! First day. My laptop connects but I only get the guest Wi-Fi style stuff, I can\'t see the file share and the intranet is blocked."',
  brief:'Desk 6 is SW2 Gi0/6. Staff desks belong in VLAN 10 (STAFF, 10.10.10.0/24). Guests live in VLAN 1 (192.168.100.0/24, untagged to R1).',
  faults:{SW2:['interface g0/6','no switchport access vlan']},
  success:[{type:'host_net',host:'NEWHIRE',net:'10.10.10.0/24'},R('NEWHIRE','10.10.10.5',445,'SRV-1 file share')],
  constraints:[R('PC-10-1','10.10.10.5',445,'SRV-1 file share')],
  hints:['The laptop got an address, just not one from the staff range. Which hall (VLAN) is the port bound to?','On SW2: show vlan brief, and look for Gi0/6. Compare with show interfaces g0/6 switchport.','An access port that has no switchport access vlan line sits in VLAN 1 by default. Bind it to VLAN 10 with switchport access vlan 10. (In real life the laptop keeps its guest lease until it renews: bounce the port or run ipconfig /release then /renew.)'],
  solution:[{dev:'SW2',lines:['enable','configure terminal','interface g0/6','switchport access vlan 10','end']}],
  wrong:[{why:'put the port in VLAN 20 (Sales)',steps:[{dev:'SW2',lines:['en','conf t','int g0/6','sw acc vlan 20','end']}]}],
  debrief:{curse:'SW2 Gi0/6 had no access VLAN configured, so it defaulted to VLAN 1 (guest).',concept:'Every access port belongs to exactly one data VLAN. VLAN 1 is the default for all ports, which is why many networks avoid putting real users or guests on it.',real:'Port templates get missed on new desks. show vlan brief is the fastest way to audit which ports sit where.'}},
 {id:'T-014',era:2,topology:'closet',flavor:'The Silent Scribe of Hall 30',title:'VLAN 30 can\'t reach the printer',tier:3,xp:{access:200},obj:['2.2'],sla:15,reporter:'Mira (Studio) · irritated',start:'PC-30-1',
  symptom:'"Nobody in the Studio can print, or get on the network at all. Accounting upstairs on the same switch is fine. This started after last night\'s switch maintenance."',
  brief:'Studio desks are VLAN 30 (10.10.30.0/24) on SW2. SW2 reaches the rest of the building over Port-channel 1 to SW1. Change control says: do not open trunks to all VLANs.',
  faults:{SW2:['interface port-channel 1','switchport trunk allowed vlan 1,10,20,50,99']},
  success:[{type:'host_net',host:'PC-30-1',net:'10.10.30.0/24'},R('PC-30-1','10.10.10.40',9100,'PRN-2 print queue')],
  constraints:[R('PC-10-1','10.10.10.5',445,'SRV-1 file share'),R('PC-ADMIN','10.0.99.12',0,'SW2 management (10.0.99.12)')],
  style:[{type:'not_all',dev:'SW2',if:'po1'}],
  hints:['The VLAN exists on both switches and VLAN 10 crosses fine. What decides which VLANs may ride the uplink?','Compare show interfaces trunk on SW2 and SW1. Read "Vlans allowed on trunk" for Po1.','A trunk only carries VLANs in its allowed list. switchport trunk allowed vlan 30 REPLACES the list (breaking every other VLAN); switchport trunk allowed vlan add 30 appends to it. Configure the port-channel interface, not the member ports: settings on Po1 propagate to members.'],
  solution:[{dev:'SW2',lines:['enable','configure terminal','interface port-channel 1','switchport trunk allowed vlan add 30','end']}],
  alt:[[{dev:'SW2',lines:['en','conf t','int po1','switchport trunk allowed vlan 1,10,20,30,50,99','end']}]],
  wrong:[{why:'replaced the allowed list with only VLAN 30',steps:[{dev:'SW2',lines:['en','conf t','int po1','switchport trunk allowed vlan 30','end']}]},{why:'edited the member ports instead of Port-channel 1 (members get suspended)',steps:[{dev:'SW2',lines:['en','conf t','interface range g0/23 - 24','switchport trunk allowed vlan add 30','end']}]}],
  debrief:{curse:'Port-channel 1 on SW2 allowed VLANs 1,10,20,50,99 but not 30.',concept:'802.1Q trunks carry only allowed and active VLANs. Use "add" and "remove" to edit the list. On an EtherChannel, configure the port-channel interface so members stay consistent; mismatched members are suspended.',real:'The allowed-list overwrite is one of the most common outage-causing typos in networking. Many teams ban the bare form in change reviews.'}},
 {id:'T-015',era:2,topology:'closet',flavor:'Voices Crossed',title:'Phones work, PCs behind them don\'t',tier:3,xp:{access:200},obj:['2.1'],sla:15,reporter:'Kai (Desk 5) · busy',start:'PC-5',
  symptom:'"My desk phone is fine, but the PC plugged into the back of the phone gets some weird address and nothing works."',
  brief:'Desk 5 is SW2 Gi0/5: IP phone with a PC daisy-chained behind it. Standard: data VLAN 10 (STAFF), voice VLAN 50 (VOICE, 10.10.50.0/24).',
  faults:{SW2:['interface g0/5','switchport access vlan 50','switchport voice vlan 10']},
  success:[{type:'host_net',host:'PC-5',net:'10.10.10.0/24'},{type:'host_net',host:'PHONE-5',net:'10.10.50.0/24'}],
  constraints:[R('PC-5','10.10.10.5',445,'SRV-1 file share')],
  hints:['The PC sends untagged frames; the phone tags its own. Which VLAN does each one land in?','On PC-5: ipconfig. On SW2: show interfaces g0/5 switchport (Access Mode VLAN vs Voice VLAN).','On a phone port, switchport access vlan is the data VLAN for the untagged PC traffic and switchport voice vlan is the tagged VLAN the phone learns via CDP/LLDP. They were swapped. Set access vlan 10 and voice vlan 50.'],
  solution:[{dev:'SW2',lines:['enable','configure terminal','interface g0/5','switchport access vlan 10','switchport voice vlan 50','end']}],
  wrong:[{why:'fixed the data VLAN but left the voice VLAN on 10',steps:[{dev:'SW2',lines:['en','conf t','int g0/5','switchport access vlan 10','end']}]}],
  debrief:{curse:'Data and voice VLANs were swapped on SW2 Gi0/5.',concept:'One access port can carry an untagged data VLAN plus a tagged voice VLAN. The phone learns the voice VLAN from the switch and tags its own frames; the PC behind it stays untagged.',real:'Phone ports are often configured by copying another port. Always check both lines together.'}},
 {id:'T-016',era:2,topology:'closet',flavor:'Mismatched Tongues',title:'CDP complains about native VLAN',tier:3,xp:{access:200},obj:['2.2','2.3'],sla:15,reporter:'Monitoring · automated',start:'PC-ADMIN',
  symptom:'"Syslog is flooding with native VLAN mismatch messages from SW1 and SW2. Also, NetOps can no longer manage SW2 (10.0.99.12)."',
  brief:'You start on PC-ADMIN (VLAN 99, management). Company standard: native VLAN 99 on every inter-switch trunk. Don\'t change SW1, it is already compliant.',
  faults:{SW2:['interface port-channel 1','no switchport trunk native vlan']},
  success:[{type:'native',dev:'SW1',if:'po1',vlan:99},{type:'native',dev:'SW2',if:'po1',vlan:99},R('PC-ADMIN','10.0.99.12',0,'SW2 management (10.0.99.12)')],
  constraints:[R('PC-10-1','10.10.10.5',445,'SRV-1 file share')],
  hints:['Untagged frames on a trunk belong to the native VLAN, and each end decides that for itself.','On SW1 run show logging (look for CDP-4-NATIVE_VLAN_MISMATCH), then show interfaces trunk on both switches.','If the ends disagree on the native VLAN, untagged traffic leaks between two different VLANs: VLAN 99 frames from SW1 arrive in VLAN 1 on SW2. Set switchport trunk native vlan 99 on SW2 Port-channel 1.'],
  solution:[{dev:'SW2',lines:['enable','configure terminal','interface port-channel 1','switchport trunk native vlan 99','end']}],
  wrong:[{why:'changed SW1 to native VLAN 1 to match (breaks the standard)',steps:[{dev:'SW1',lines:['en','conf t','int po1','no switchport trunk native vlan','end']}]}],
  debrief:{curse:'SW2 Port-channel 1 used native VLAN 1 while SW1 used native VLAN 99.',concept:'The native VLAN is untagged on a trunk. A mismatch silently bridges two VLANs together and breaks anything (like management) that lives in them. CDP detects and logs it.',real:'Using an unused native VLAN like 99 or 999 is a common hardening step. It only works if both ends agree.'}},
 {id:'T-017',era:2,topology:'closet',flavor:'Two Shy Stones',title:'New switch won\'t trunk',tier:3,xp:{access:200},obj:['2.2'],sla:15,reporter:'Field tech · on site',start:'SW2',
  symptom:'"I racked the new second-floor switch and cabled the uplink on Gi0/24. Link lights are green, but every desk on SW2 is dead except the default VLAN."',
  brief:'You start on SW2\'s console. Only Gi0/24 is cabled between SW1 and SW2 today. Both ends were left at factory switchport settings.',
  faults:{SW1:['no interface port-channel 1','interface range g0/23 - 24','no switchport trunk native vlan','switchport mode dynamic auto','interface g0/23','shutdown'],SW2:['no interface port-channel 1','interface range g0/23 - 24','no switchport trunk native vlan','switchport mode dynamic auto','interface g0/23','shutdown']},
  success:[{type:'trunk_up',dev:'SW2',if:'g0/24'},{type:'host_net',host:'PC-20-1',net:'10.10.20.0/24'},R('PC-20-1','8.8.8.8',0,'the internet (8.8.8.8)')],
  constraints:[R('PC-ADMIN','10.0.99.12',0,'SW2 management (10.0.99.12)')],
  hints:['Both stones are waiting for the other to speak first.','show interfaces g0/24 switchport on both switches: compare Administrative Mode and Operational Mode. show interfaces trunk shows nothing.','DTP: dynamic auto only forms a trunk if the other side asks (trunk or dynamic desirable). Auto + auto stays an access port. Set switchport mode trunk on at least one end (ideally both, in production).'],
  solution:[{dev:'SW2',lines:['enable','configure terminal','interface g0/24','switchport mode trunk','end']}],
  alt:[[{dev:'SW1',lines:['en','conf t','int g0/24','switchport mode trunk','end']}],[{dev:'SW2',lines:['en','conf t','int g0/24','switchport mode dynamic desirable','end']}]],
  wrong:[{why:'set the uplink to access mode',steps:[{dev:'SW2',lines:['en','conf t','int g0/24','switchport mode access','end']}]}],
  debrief:{curse:'Both ends of the uplink were dynamic auto, so DTP never formed a trunk.',concept:'Trunk formation: trunk + anything negotiable = trunk; desirable + auto/desirable = trunk; auto + auto = access. Static "switchport mode trunk" (often with nonegotiate) is the production norm.',real:'Factory defaults vary by platform. Never rely on DTP on an uplink; configure it explicitly.'}},
 {id:'T-018',era:2,topology:'closet',flavor:'Half a Bond',title:'Uplink bandwidth halved',tier:3,xp:{access:200},obj:['2.4'],sla:15,reporter:'Backup admin · grumpy',start:'SW1',
  symptom:'"Nightly backups from the second floor now take twice as long. Nothing is down, it is just slow. Someone was \'tidying\' SW2 last week."',
  brief:'SW1 and SW2 should be bundled on Gi0/23-24 as Port-channel 1 using LACP (company standard: LACP only, never mode on).',
  faults:{SW2:['interface g0/24','channel-group 2 mode on']},
  success:[{type:'bundle',dev:'SW1',po:1,members:2,lacp:true},{type:'bundle',dev:'SW2',po:1,members:2,lacp:true}],
  constraints:[R('PC-10-1','10.10.10.5',445,'SRV-1 file share')],
  hints:['A bond needs both strands, and both ends must speak the same language.','On SW1 and SW2: show etherchannel summary. Look at the flags next to Gi0/24 and the protocol column. show logging on SW1 helps too.','"mode on" forces a bundle with no negotiation; "active"/"passive" use LACP. LACP facing "on" gets suspended (s). On SW2, put Gi0/24 back in group 1 with channel-group 1 mode active.'],
  solution:[{dev:'SW2',lines:['enable','configure terminal','interface g0/24','channel-group 1 mode active','end']}],
  alt:[[{dev:'SW2',lines:['en','conf t','int g0/24','no channel-group','channel-group 1 mode passive','end']}]],
  wrong:[{why:'forced SW1 to mode on (breaks the LACP standard and still mismatches)',steps:[{dev:'SW1',lines:['en','conf t','interface range g0/23 - 24','channel-group 1 mode on','end']}]},{why:'tried to mix mode on into an LACP group',expectErr:true,steps:[{dev:'SW2',lines:['en','conf t','int g0/24','channel-group 1 mode on','end']}]}],
  debrief:{curse:'SW2 Gi0/24 was moved into a separate group in mode on, so SW1\'s LACP member was suspended.',concept:'EtherChannel modes: on (no protocol), LACP active/passive, PAgP desirable/auto. Only compatible pairs bundle. A suspended member carries no traffic, so the bundle runs at half speed.',real:'Bundles rarely fail loudly. show etherchannel summary should be on every post-change checklist.'}},
 {id:'T-019',era:2,topology:'closet',flavor:'The Guarded Gate',title:'Port dead after desk switch plugged in',tier:2,xp:{access:150},obj:['2.5'],sla:10,reporter:'Hana (HR) · apologetic',start:'PC-HR',
  symptom:'"I plugged a little switch in at my desk so I could share the port with my printer. Everything died. Facilities took the little switch away an hour ago but my PC is still offline."',
  brief:'HR desk 7 is SW2 Gi0/7. Security policy: BPDU guard stays enabled on every user port.',
  errdisable:[{dev:'SW2',if:'g0/7',cause:'bpduguard',log:['%SPANTREE-2-BLOCK_BPDUGUARD: Received BPDU on port GigabitEthernet0/7 with BPDU Guard enabled. Disabling port.','%PM-4-ERR_DISABLE: bpduguard error detected on Gi0/7, putting Gi0/7 in err-disable state']}],
  success:[{type:'host_net',host:'PC-HR',net:'10.10.10.0/24'},R('PC-HR','10.10.10.5',445,'SRV-1 file share')],
  constraints:[{type:'bpduguard',dev:'SW2',if:'g0/7'}],
  hints:['The gate closed itself for a reason, and the reason is gone. Gates like this do not reopen on their own by default.','On SW2: show interfaces status err-disabled, and show logging.','BPDU guard err-disables a portfast port that receives a BPDU (from a switch). After removing the cause, recover the port with shutdown followed by no shutdown (or configure errdisable recovery cause bpduguard). Do not remove BPDU guard.'],
  solution:[{dev:'SW2',lines:['enable','configure terminal','interface g0/7','shutdown','no shutdown','end']}],
  alt:[[{dev:'SW2',lines:['en','conf t','errdisable recovery cause bpduguard','end']}]],
  wrong:[{why:'only typed no shutdown (an err-disabled port needs shutdown first)',steps:[{dev:'SW2',lines:['en','conf t','int g0/7','no shutdown','end']}]},{why:'disabled BPDU guard to make it come back',steps:[{dev:'SW2',lines:['en','conf t','int g0/7','no spanning-tree bpduguard','shutdown','no shutdown','end']}]}],
  debrief:{curse:'BPDU guard err-disabled SW2 Gi0/7 when a desk switch sent BPDUs.',concept:'PortFast skips spanning-tree listening/learning on host ports; BPDU guard protects that shortcut by shutting the port if a switch appears. err-disabled ports stay down until shut/no shut or errdisable recovery.',real:'Desk switches cause loops and rogue roots. BPDU guard is the cheap insurance; keep it and educate the user.'}},
 {id:'T-040',era:2,topology:'closet',flavor:'One Too Many',title:'Port shut down after hub plugged in',tier:2,xp:{sec:150},obj:['5.7'],sla:10,reporter:'Theo (Front desk) · stressed',start:'PC-FRONT',
  symptom:'"A visitor plugged their laptop into a little hub at the front desk to \'borrow\' my connection. Now my PC has no network. The hub is gone now, I promise."',
  brief:'Front desk 9 is SW2 Gi0/9, protected by port security (1 MAC address, violation shutdown). Security wants that policy kept exactly as is.',
  errdisable:[{dev:'SW2',if:'g0/9',cause:'psecure-violation',lastMac:'3c52.a1d4.9f02:10',log:['%PORT_SECURITY-2-PSECURE_VIOLATION: Security violation occurred, caused by MAC address 3c52.a1d4.9f02 on port GigabitEthernet0/9.','%PM-4-ERR_DISABLE: psecure-violation error detected on Gi0/9, putting Gi0/9 in err-disable state']}],
  success:[{type:'host_net',host:'PC-FRONT',net:'10.10.10.0/24'},R('PC-FRONT','10.10.10.5',445,'SRV-1 file share')],
  constraints:[{type:'psec',dev:'SW2',if:'g0/9',max:1}],
  hints:['A second, unknown face appeared at a gate that admits one. The stranger left; the gate is still barred.','On SW2: show port-security interface g0/9 and show interfaces status err-disabled.','With violation mode shutdown, a second MAC err-disables the port. Once the extra device is gone, recover with shutdown then no shutdown. Raising the maximum or removing port security would violate policy.'],
  solution:[{dev:'SW2',lines:['enable','configure terminal','interface g0/9','shutdown','no shutdown','end']}],
  wrong:[{why:'raised the maximum to 5 MAC addresses',steps:[{dev:'SW2',lines:['en','conf t','int g0/9','switchport port-security maximum 5','shutdown','no shutdown','end']}]},{why:'removed port security',steps:[{dev:'SW2',lines:['en','conf t','int g0/9','no switchport port-security','shutdown','no shutdown','end']}]}],
  debrief:{curse:'Port security on SW2 Gi0/9 saw two MAC addresses (max 1) and err-disabled the port.',concept:'Port security limits which and how many MACs a port learns. Violation modes: shutdown (err-disable), restrict (drop + log), protect (drop silently).',real:'Front desks and conference rooms are the usual offenders. Sticky MACs make the learned address part of the config.'}},
 {id:'T-021',era:2,topology:'closet',flavor:'A Stair to Nowhere',title:'Inter-VLAN routing broken for one VLAN',tier:3,xp:{access:100,conn:100},obj:['2.1','3.1'],sla:15,reporter:'Mira (Studio) · annoyed',start:'PC-30-1',
  symptom:'"Studio machines get some 169.254 address and can\'t reach anyone. Every other department is fine. The router was \'cleaned up\' last night."',
  brief:'R1 routes between VLANs on a trunk (router-on-a-stick): one subinterface per VLAN on Gi0/0. VLAN 30 gateway is 10.10.30.1. R1 reboots tonight for maintenance, so make the fix permanent.',
  faults:{R1:['interface g0/0.30','encapsulation dot1q 31']},
  success:[{type:'host_net',host:'PC-30-1',net:'10.10.30.0/24'},R('PC-30-1','PC-10-1',0,'PC-10-1 in VLAN 10'),R('PC-30-1','10.10.10.5',445,'SRV-1 file share')],
  constraints:[{type:'saved',dev:'R1'}],
  hints:['The stairway exists and has the right address, but it leads to a different floor than its sign says.','On R1: show running-config | section interface, or show interfaces g0/0.30. Compare each subinterface\'s encapsulation dot1Q tag with its IP subnet.','Each router subinterface must tag the same VLAN ID the switch uses (encapsulation dot1q 30 for VLAN 30). Then save with copy running-config startup-config (or write memory) so tonight\'s reload keeps it.'],
  solution:[{dev:'R1',lines:['enable','configure terminal','interface g0/0.30','encapsulation dot1q 30','end','copy running-config startup-config','']}],
  alt:[[{dev:'R1',lines:['en','conf t','int g0/0.30','encapsulation dot1Q 30','end','write memory']}]],
  wrong:[{why:'fixed it but did not save before the reload',steps:[{dev:'R1',lines:['en','conf t','int g0/0.30','encapsulation dot1q 30','end']}]},{why:'retagged the VLAN 10 subinterface instead',steps:[{dev:'R1',lines:['en','conf t','int g0/0.10','encapsulation dot1q 30','end','write memory']}]}],
  debrief:{curse:'R1 Gi0/0.30 was tagged for VLAN 31 instead of 30.',concept:'Router-on-a-stick: one trunk, one subinterface per VLAN, each with encapsulation dot1Q <vlan> and the VLAN\'s gateway IP. The tag must match the switch VLAN or frames never meet. Without a gateway in the VLAN, DHCP fails too, hence 169.254.',real:'Unsaved fixes are the classic "it broke again after the reboot" ticket. Inscribe (copy run start) every time.'}},
 {id:'T-022',era:2,topology:'closet',flavor:'The Locked Speaking-Stone',title:'Can\'t SSH to the new switch',tier:2,xp:{access:100,svc:50},obj:['2.8','4.8'],sla:10,reporter:'NetOps lead · firm',start:'PC-ADMIN',
  symptom:'"ssh to SW2 (10.0.99.12) gets connection refused. Policy: SSH only, no Telnet, local accounts. Create the account netadmin with a secret of your choice."',
  brief:'You start on PC-ADMIN. Console into SW2 from the device list. When done, test it yourself with ssh -l netadmin 10.0.99.12 from PC-ADMIN. Save the config.',
  success:[{type:'ssh_ok',from:'PC-ADMIN',to:'10.0.99.12',label:'SW2 (10.0.99.12)'}],
  constraints:[{type:'ssh_only',dev:'SW2'},{type:'saved',dev:'SW2'}],
  hints:['A speaking-stone needs a name, keys, a guest list and a door that admits the right language.','On SW2: show ip ssh, and show running-config | section line vty.','SSH needs: a hostname (not the default) and ip domain-name, RSA keys (crypto key generate rsa, 2048 bits; 768+ for SSHv2), a local user (username netadmin privilege 15 secret ...), and on line vty 0 4: login local plus transport input ssh. Optional: ip ssh version 2. Then write memory.'],
  solution:[{dev:'SW2',lines:['enable','configure terminal','ip domain-name netmancer.local','crypto key generate rsa modulus 2048','username netadmin privilege 15 secret Arc4n3!','ip ssh version 2','line vty 0 4','transport input ssh','login local','end','write memory']},{dev:'PC-ADMIN',lines:['ssh -l netadmin 10.0.99.12','Arc4n3!','show ip ssh','exit']}],
  alt:[[{dev:'SW2',lines:['en','conf t','ip domain name netmancer.local','crypto key generate rsa','2048','username netadmin secret S3cret!','line vty 0 4','transport input ssh','login local','end','copy run start','']}]],
  wrong:[{why:'allowed Telnet as well (transport input all)',steps:[{dev:'SW2',lines:['en','conf t','ip domain-name netmancer.local','crypto key generate rsa modulus 2048','username netadmin secret x','line vty 0 4','transport input all','login local','end','write memory']}]},{why:'skipped the domain name, so no RSA keys were generated',steps:[{dev:'SW2',lines:['en','conf t','crypto key generate rsa modulus 2048','username netadmin secret x','line vty 0 4','transport input ssh','login local','end','write memory']}]}],
  debrief:{curse:'SW2 had no domain name, no RSA keys, no local user, and VTY lines that only accepted Telnet.',concept:'SSH on network devices: hostname + ip domain-name -> crypto key generate rsa -> local username -> line vty: login local + transport input ssh. Telnet sends credentials in clear text.',real:'This is the first thing done on every new device. Many shops keep it in a "day zero" template.'}}

 {id:'T-024',era:3,topology:'tower',flavor:'The One-Way Road',title:'Branch can\'t reach HQ',tier:3,xp:{conn:200},obj:['3.3'],sla:15,reporter:'Ben (Branch) · exasperated',start:'PC-B10',
  symptom:'"Nobody at the branch can open anything at HQ. tracert gets as far as the HQ router and then just stars. HQ says their side is fine."',
  brief:'Static routing between sites.'+TOWER_BRIEF+' The R1 config was trimmed during last night\'s change.',
  faults:{R1:['no ip route 10.20.10.0 255.255.255.0 172.16.1.2','no ip route 10.20.20.0 255.255.255.0 172.16.1.2','no ip route 10.20.10.0 255.255.255.0 172.16.9.2 200','no ip route 10.20.20.0 255.255.255.0 172.16.9.2 200']},
  success:[R('PC-B10','10.1.10.5',445,'SRV-HQ file share'),R('PC-B20','10.1.10.5',445,'SRV-HQ file share'),R('PC-HQ','PC-B10',0,'PC-B10 at the branch')],
  constraints:[R('PC-HQ','8.8.8.8',0,'the internet (8.8.8.8)')],
  hints:['Packets need a road there and a road back. Which router is missing the road home?','On R1: show ip route. Is there any entry covering 10.20.10.0/24 or 10.20.20.0/24? Compare with R2\'s table.','The branch can send to HQ (R2 has routes), but R1 has no route back to the branch subnets, so replies die at R1. Add static routes on R1 for both branch subnets via the branch next hop 172.16.1.2 (ip route <network> <mask> <next-hop>), or one summary 10.20.0.0/16.'],
  solution:[{dev:'R1',lines:['enable','configure terminal','ip route 10.20.10.0 255.255.255.0 172.16.1.2','ip route 10.20.20.0 255.255.255.0 172.16.1.2','end']}],
  alt:[[{dev:'R1',lines:['en','conf t','ip route 10.20.0.0 255.255.0.0 172.16.1.2','end']}]],
  wrong:[{why:'added a route for VLAN 10 only',steps:[{dev:'R1',lines:['en','conf t','ip route 10.20.10.0 255.255.255.0 172.16.1.2','end']}]},{why:'pointed the route at R1\'s own WAN address',steps:[{dev:'R1',lines:['en','conf t','ip route 10.20.0.0 255.255.0.0 172.16.1.1','end']}]},{why:'changed R2 instead of R1',steps:[{dev:'R2',lines:['en','conf t','ip route 10.1.10.0 255.255.255.0 172.16.1.1','end']}]}],
  debrief:{curse:'R1 had no route back to the branch subnets 10.20.10.0/24 and 10.20.20.0/24.',concept:'Routing is hop-by-hop and one-directional. Every router on the return path needs its own route back. A static route names the destination network, its mask and a next hop that is directly connected.',real:'"It works one way" is almost always a missing return route, or a firewall/NAT on the way back.'}},
 {id:'T-025',era:3,topology:'tower',flavor:'Lost Beyond the Walls',title:'Branch has no internet',tier:2,xp:{conn:150},obj:['3.3'],sla:10,reporter:'Ben (Branch) · annoyed',start:'PC-B10',
  symptom:'"We can get to the HQ file share fine, but no websites at all from the branch. HQ browses normally."',
  brief:'Internet access exits at HQ: R1 Gi0/2 to the ISP.'+TOWER_BRIEF,
  faults:{R2:['no ip route 0.0.0.0 0.0.0.0 172.16.1.1','no ip route 0.0.0.0 0.0.0.0 172.16.9.1 200']},
  success:[R('PC-B10','8.8.8.8',0,'the internet (8.8.8.8)'),R('PC-B10','93.184.216.34',443,'www.example.com (TCP 443)')],
  constraints:[R('PC-B10','10.1.10.5',445,'SRV-HQ file share')],
  hints:['The branch knows the way to HQ, but only to HQ. How does a router handle a destination it has never heard of?','On R2: show ip route. Look for "Gateway of last resort".','A router drops packets with no matching route. A default route (ip route 0.0.0.0 0.0.0.0 <next-hop>) catches everything else. The next hop must be directly connected: R1\'s WAN address 172.16.1.1, not the ISP.'],
  solution:[{dev:'R2',lines:['enable','configure terminal','ip route 0.0.0.0 0.0.0.0 172.16.1.1','end']}],
  wrong:[{why:'pointed the default route at the ISP address (not directly connected)',steps:[{dev:'R2',lines:['en','conf t','ip route 0.0.0.0 0.0.0.0 203.0.113.1','end']}]},{why:'pointed the default route at R2\'s own address',steps:[{dev:'R2',lines:['en','conf t','ip route 0.0.0.0 0.0.0.0 172.16.1.2','end']}]}],
  debrief:{curse:'R2 had no default route (gateway of last resort not set).',concept:'0.0.0.0/0 matches every destination with the shortest possible prefix, so it is used only when nothing more specific matches. show ip route shows it as S* and sets the gateway of last resort.',real:'Branches usually send everything not local toward HQ or a local internet breakout. A missing default is a classic post-change outage.'}},
 {id:'T-026',era:3,topology:'tower',flavor:'The Long Way Round',title:'Traffic to one server takes the slow path',tier:4,xp:{conn:250},obj:['3.1','3.2'],sla:15,reporter:'Ana (HQ) · puzzled',start:'PC-HQ',
  symptom:'"Opening anything on SRV-B, the branch file server, is painfully slow from HQ. Every other branch machine is snappy. Someone \'tested 4G failover\' last month."',
  brief:'SRV-B is 10.20.10.50.'+TOWER_BRIEF+' Policy: keep the floating 4G backup routes (AD 200) in place.',
  faults:{R1:['ip route 10.20.10.50 255.255.255.255 172.16.9.2']},
  success:[{type:'path_via',from:'PC-HQ',to:'10.20.10.50',via:'172.16.1.2',avoid:'172.16.9.2',label:'PC-HQ reaches SRV-B over the fiber WAN, not 4G'},R('PC-HQ','10.20.10.50',445,'SRV-B file share')],
  constraints:[{type:'route_present',dev:'R1',net:'10.20.10.0',mask:'255.255.255.0',nh:'172.16.9.2',ad:200,label:'R1 keeps its floating 4G backup route for 10.20.10.0/24 (AD 200)'}],
  hints:['Only one destination is slow. What would make a router treat one address differently from its neighbours?','From PC-HQ: tracert 10.20.10.50 vs tracert 10.20.10.100. On R1: show ip route 10.20.10.50, or show ip route static.','Routers always pick the longest matching prefix before looking at administrative distance. A leftover /32 host route beats the /24, sending SRV-B traffic over 4G. Remove the /32 (no ip route ... 255.255.255.255 ...).'],
  solution:[{dev:'R1',lines:['enable','configure terminal','no ip route 10.20.10.50 255.255.255.255 172.16.9.2','end']}],
  wrong:[{why:'removed the floating backup route instead',steps:[{dev:'R1',lines:['en','conf t','no ip route 10.20.10.0 255.255.255.0 172.16.9.2 200','end']}]},{why:'re-added the /24 over fiber (the /32 still wins)',steps:[{dev:'R1',lines:['en','conf t','ip route 10.20.10.0 255.255.255.0 172.16.1.2','end']}]}],
  debrief:{curse:'A leftover host route 10.20.10.50/32 on R1 pointed at the 4G link.',concept:'Route selection order: longest prefix match first, then lowest administrative distance, then lowest metric. A /32 always wins over a /24, whatever its AD.',real:'Temporary test routes are rarely removed. Review show ip route static after every change window.'}},
 {id:'T-027',era:3,topology:'tower',flavor:'The Sleeping Backup',title:'Branch traffic stuck on the backup link',tier:4,xp:{conn:250},obj:['3.3'],sla:15,reporter:'Finance · alarmed',start:'PC-HQ',
  symptom:'"Since the move to OSPF, everything to the branch staff VLAN crawls and the 4G bill tripled. NetOps says the fiber is fine."',
  brief:'HQ and branch now run single-area OSPF over the fiber WAN.'+TOWER_BRIEF+' The 4G link is backup only, via floating static routes. Policy: floating statics use AD 200, so failover must still work if the fiber dies.',
  faults:{R1:OSPF1.concat(['no ip route 10.20.10.0 255.255.255.0 172.16.9.2 200','ip route 10.20.10.0 255.255.255.0 172.16.9.2 100']),R2:OSPF2},
  success:[{type:'path_via',from:'PC-HQ',to:'PC-B10',via:'172.16.1.2',avoid:'172.16.9.2',label:'PC-HQ reaches PC-B10 over the fiber WAN (OSPF)'},{type:'failover',from:'PC-HQ',to:'PC-B10',shut:{dev:'R1',if:'g0/1'},label:'If the fiber fails (R1 Gi0/1 down), PC-HQ still reaches PC-B10 over 4G'}],
  constraints:[{type:'route_present',dev:'R1',net:'10.20.10.0',mask:'255.255.255.0',nh:'172.16.9.2',ad:200,label:'R1 floating route for 10.20.10.0/24 uses AD 200 (policy)'}],
  hints:['Two roads lead to the same hall. The router believes the one with the lower number.','On R1: show ip route 10.20.10.0 and show ip route static. Compare the [AD/metric] of the static route with OSPF\'s 110.','A floating static route must have a higher administrative distance than the dynamic route it backs up (OSPF = 110). AD 100 beats OSPF, so the backup is always used. Re-enter the static with AD 200: ip route 10.20.10.0 255.255.255.0 172.16.9.2 200.'],
  solution:[{dev:'R1',lines:['enable','configure terminal','ip route 10.20.10.0 255.255.255.0 172.16.9.2 200','end']}],
  alt:[[{dev:'R1',lines:['en','conf t','no ip route 10.20.10.0 255.255.255.0 172.16.9.2 100','ip route 10.20.10.0 255.255.255.0 172.16.9.2 200','end']}]],
  wrong:[{why:'deleted the backup route (no failover left)',steps:[{dev:'R1',lines:['en','conf t','no ip route 10.20.10.0 255.255.255.0 172.16.9.2 100','end']}]},{why:'set AD 110, a tie with OSPF',steps:[{dev:'R1',lines:['en','conf t','ip route 10.20.10.0 255.255.255.0 172.16.9.2 110','end']}]}],
  debrief:{curse:'The floating static route for 10.20.10.0/24 had AD 100, lower than OSPF\'s 110, so it was always preferred.',concept:'Administrative distance ranks route sources: connected 0, static 1, OSPF 110. A floating static is a static with an AD above the primary protocol, so it only appears in the table when the primary route disappears.',real:'Backup links billed per GB make this mistake expensive. Test failover by shutting the primary link in a maintenance window.'}},
 {id:'T-028',era:3,topology:'tower',flavor:'Out of Rhythm',title:'OSPF neighbor never comes up',tier:4,xp:{conn:250},obj:['3.4'],sla:15,reporter:'NetOps · on call',start:'R1',
  symptom:'"After last night\'s \'OSPF tuning\' on the branch router, show ip ospf neighbor on R1 is empty. The branch limps along over 4G."',
  brief:'Single-area OSPF (area 0) over the fiber WAN.'+TOWER_BRIEF+' Standard: default OSPF timers (hello 10 s, dead 40 s) on every link.',
  faults:{R1:OSPF1,R2:OSPF2.concat(['interface g0/1','ip ospf hello-interval 5'])},
  success:[{type:'ospf_nbr',dev:'R1',nbr:'R2'},{type:'path_via',from:'PC-HQ',to:'PC-B10',via:'172.16.1.2',avoid:'172.16.9.2',label:'PC-HQ reaches PC-B10 over the fiber WAN'}],
  constraints:[{type:'ospf_hello',dev:'R1',if:'g0/1',hello:10,dead:40},{type:'ospf_hello',dev:'R2',if:'g0/1',hello:10,dead:40}],
  hints:['Two stones must chant at the same rhythm to hear each other.','On R1: show ip ospf neighbor and show ip ospf interface brief. On both routers: show running-config | section interface GigabitEthernet0/1.','OSPF neighbors must agree on area, subnet/mask, hello and dead intervals (and authentication, stub flags, MTU). R2 Gi0/1 sends hellos every 5 s with a 20 s dead time. Put it back to the default: no ip ospf hello-interval.'],
  solution:[{dev:'R2',lines:['enable','configure terminal','interface g0/1','no ip ospf hello-interval','end']}],
  alt:[[{dev:'R2',lines:['en','conf t','int g0/1','ip ospf hello-interval 10','end']}]],
  wrong:[{why:'changed R1 to match (breaks the timer standard)',steps:[{dev:'R1',lines:['en','conf t','int g0/1','ip ospf hello-interval 5','end']}]},{why:'added static routes instead of fixing OSPF',steps:[{dev:'R1',lines:['en','conf t','ip route 10.20.10.0 255.255.255.0 172.16.1.2','ip route 10.20.20.0 255.255.255.0 172.16.1.2','end']}]}],
  debrief:{curse:'Hello/dead timer mismatch on the WAN link (R2 Gi0/1 hello 5 s vs R1 10 s).',concept:'OSPF hellos carry the hello and dead intervals; if they differ the hello is ignored and no neighbor forms. Changing hello alone also changes dead to 4x hello.',real:'Faster timers speed up failover, but they must match on both ends. Many teams use BFD instead of tuning hellos.'}},
 {id:'T-030',era:3,topology:'tower',flavor:'The Unannounced Hall',title:'New LAN not in the routing tables',tier:3,xp:{conn:200},obj:['3.4'],sla:15,reporter:'Lab lead · impatient',start:'PC-HQ',
  symptom:'"The branch lab VLAN (10.20.20.0/24) is reachable from HQ, but only crawling over the 4G backup. The staff VLAN next to it is fine over fiber."',
  brief:'Both sites run OSPF area 0.'+TOWER_BRIEF+' Use OSPF, not static routes, for the lab.',
  faults:{R1:OSPF1,R2:OSPF2.concat(['router ospf 1','no network 10.20.20.0 0.0.0.255 area 0','network 10.20.20.0 0.0.0.0 area 0'])},
  success:[{type:'route_type',dev:'R1',prefix:'10.20.20.0/24',rtype:'O'},{type:'path_via',from:'PC-HQ',to:'PC-B20',via:'172.16.1.2',avoid:'172.16.9.2',label:'PC-HQ reaches PC-B20 over the fiber WAN'}],
  constraints:[{type:'no_static',dev:'R1',prefix:'10.20.20.0/24'}],
  hints:['The hall exists, but nobody announced it to the circle.','On R1: show ip route ospf. On R2: show ip protocols ("Routing for Networks") and show ip ospf interface brief.','A network statement enables OSPF on interfaces whose IP matches it under the wildcard. 10.20.20.0 0.0.0.0 only matches the address 10.20.20.0 itself, not R2\'s 10.20.20.1. Use wildcard 0.0.0.255 (or match the interface IP exactly).'],
  solution:[{dev:'R2',lines:['enable','configure terminal','router ospf 1','no network 10.20.20.0 0.0.0.0 area 0','network 10.20.20.0 0.0.0.255 area 0','end']}],
  alt:[[{dev:'R2',lines:['en','conf t','router ospf 1','network 10.20.20.1 0.0.0.0 area 0','end']}]],
  wrong:[{why:'added a static route on R1 instead of fixing OSPF',steps:[{dev:'R1',lines:['en','conf t','ip route 10.20.20.0 255.255.255.0 172.16.1.2','end']}]}],
  debrief:{curse:'R2 advertised the lab with network 10.20.20.0 0.0.0.0, which matches no interface.',concept:'OSPF network statements use wildcard masks (inverse masks): 0 bits must match, 1 bits are ignored. They select interfaces to run OSPF on; the advertised prefix comes from the interface\'s own mask.',real:'Wildcard typos are common. Verify with show ip protocols and show ip ospf interface brief after every change.'}},
 {id:'T-046',era:3,topology:'tower',flavor:'A Stair Never Built',title:'New VLAN has no gateway',tier:3,xp:{access:100,conn:100},obj:['2.1','3.1'],sla:15,reporter:'Cy (Branch lab) · stuck',start:'PC-B20',

/* ---------------- Bad tickets: triage before you troubleshoot. Data only. ----------------
   kind: vague (ask, then a real fault unlocks) | user (verify, then guide; change nothing) | dup (merge) | team (reassign) | mislead (user's diagnosis is wrong, real fault exists)
   verify: any command matching re on dev counts as checking before acting. check + see: the self-test's verification run and the evidence it must show. */
var triage={
 asks:{
  device:{t:'Which computer are you on? The asset tag is on the sticker (for example PC-RECEP).',short:'which device'},
  where:{t:'Where are you working right now: which desk, or from home?',short:'where they are'},
  error:{t:'What exactly does the error say? A screenshot is perfect.',short:'the exact error'},
  when:{t:'When did it start, and did anything change just before (moved desk, new cable, an update)?',short:'when it started'},
  scope:{t:'Is it only you, or are people near you affected too?',short:'who else is affected'},
  restart:{t:'Have you tried turning it off and on again?',short:'restart'},
  pw:{t:'Please reply with your password so I can test your account.',short:'their password'}
 },
 askOrder:['device','where','error','when','scope','restart','pw'],
 guides:{
  vpn:'You are working remotely, but the Wardgate VPN client is not connected. Open Wardgate from the tray, sign in and approve the request on your phone. Internal sites and your S: drive will come back.',
  wifi:'Wi-Fi is switched off on your laptop (airplane mode is still on from your flight). Turn airplane mode off and join SPIRE-CORP.',
  cable:'Your network cable has come loose. Push it firmly into the wall port and into the back of the PC until it clicks.',
  ssid:'You are on SPIRE-GUEST, which only has internet access. Forget that network and join SPIRE-CORP with your work sign-in.',
  caps:'Caps Lock is on, so your password is going in as capitals. Turn Caps Lock off and try again. Your account is fine and not locked.',
  external:'The supplier\'s site is down on their side. Our network reaches the internet normally, so there is nothing to fix here. Try again later or call the supplier.',
  paper:'The printer is out of paper. Load paper into tray 2 and your queued jobs will print by themselves.',
  restart:'Please restart your computer and try again.',
  reimage:'We will reimage your PC. Please back up your files first.'
 },
 teams:{net:'Network team (us)',desktop:'Desktop support',apps:'Business apps (payroll and HR systems)',facilities:'Facilities',security:'Security operations'}
};
function Q(id){ return quests.filter(function(q){ return q.id===id; })[0]; }

var badTickets=[
 {id:'B-101',era:1,kind:'vague',topology:'ground',flavor:'The Formless Cry',title:'internet broken',tier:1,xp:{fund:80},obj:['1.10','4.3'],sla:10,reporter:'Priya · terse',start:'SW1',
  symptom:'"internet broken again. pls fix asap"',
  brief:'The ticket has no device, no desk, no error text and no time. Ground floor office: SW1 floor switch, R1 gateway, SRV-1 DNS.',
  known:[],need:['device','error'],
  answer:'"Sorry! I\'m on the reception PC (asset tag PC-RECEP). Websites work actually, it\'s the intranet: the browser says "intranet.netmancer.local\'s server IP address could not be found". It started when the PC came back from the repair shop yesterday."',
  partial:'"It just doesn\'t work?? What else do you need from me?"',
  hints:['There is nothing in this ticket you can test. What are the smallest facts you need before you can troubleshoot?','Use Ask for info. You need at least the device and the exact error text.','Ask which computer and what the error says. Skip anything you can check yourself, and never ask for a password.'],
  act:'Ask for info: "Which computer are you on?" and "What exactly does the error say?"',
  hosts:{'PC-RECEP':{dns:['8.8.8.8']}},
  real:{start:'PC-RECEP',brief:'PC-RECEP at Reception (SW1 Gi0/3). The office DNS server is SRV-1 (10.10.10.5). The PC came back from an outside repair shop yesterday.',
   success:[{type:'resolve',host:'PC-RECEP',name:'intranet.netmancer.local'},{type:'resolve',host:'PC-RECEP',name:'www.example.com'}],
   constraints:[{type:'host_net',host:'PC-RECEP',net:'10.10.10.0/24'}],
   hints:['Websites work but the intranet name does not. Which service turns names into addresses, and which server is the PC asking?','On PC-RECEP: ipconfig /all (read "DNS Servers"), then nslookup intranet.netmancer.local.','A public resolver (8.8.8.8) cannot answer for internal names. Hand DNS back to DHCP (netsh interface ip set dns "Ethernet" dhcp) or point it at 10.10.10.5.'],
   solution:[{dev:'PC-RECEP',lines:['netsh interface ip set dns "Ethernet" dhcp']}],
   alt:[[{dev:'PC-RECEP',lines:['netsh interface ip set dns "Ethernet" static 10.10.10.5']}]],
   wrong:[{why:'pointed DNS at the gateway, which is not a DNS server',steps:[{dev:'PC-RECEP',lines:['netsh interface ip set dns "Ethernet" static 10.10.10.1']}]},{why:'only flushed the DNS cache',steps:[{dev:'PC-RECEP',lines:['ipconfig /flushdns']}]}]},
  debrief:{curse:'A vague ticket hid a real fault: PC-RECEP came back from repair with a public DNS server (8.8.8.8) typed in.',concept:'Triage first: device, exact error, time. "The internet is broken" turned out to be internal name resolution, which a public resolver can never answer.',real:'One good question beats an hour of guessing. Ask only for what you cannot check yourself.'}},
 {id:'B-102',era:1,kind:'user',topology:'ground',flavor:'The Unlit Road Home',title:'Internet down at home',tier:1,xp:{fund:60},obj:['1.10'],sla:8,reporter:'Jordan (Sales) · working from home',start:'LAPTOP-7',

  known:['device','where','error','when'],

  verify:[{dev:'LAPTOP-7',re:VPNV}],verifyHint:'One ping to a public site, one nslookup of an internal name and wardgate status prove it in a minute.',
  check:[{dev:'LAPTOP-7',lines:['ipconfig','ping www.example.com','nslookup intranet.netmancer.local','wardgate status']}],see:'192\\.168\\.1\\.23[\\s\\S]*Reply from 93\\.184\\.216\\.34[\\s\\S]*Non-existent domain[\\s\\S]*Status:\\s+Disconnected',
  guide:'vpn',cause:'Wardgate was not connected, so internal names and addresses were unreachable from home.',
  thanks:'"Connected Wardgate and approved it on my phone. The intranet and S: drive are back. Sorry!"',
  hints:['"The internet is down", but is it? Test a public site and an internal one separately.','On LAPTOP-7: ipconfig (which adapter, which network?), ping www.example.com, nslookup intranet.netmancer.local, then wardgate status.','The internet works and only internal names fail; the Wardgate adapter is disconnected. Nothing on our side is broken. Resolve as user error with the VPN guidance and change no config.'],
  act:'Resolve: user error, with the Wardgate VPN guidance.',
  debrief:{curse:'Not a network fault: Jordan was at home with the Wardgate VPN client disconnected.',concept:'Public sites answering while internal names fail is the signature of a missing VPN tunnel. ipconfig shows a home address (192.168.1.x) and the VPN adapter as "Media disconnected".',real:'"The internet is down" from a remote worker is one of the most common help desk tickets. Prove it with ping, nslookup and the VPN client status, then guide the user. You cannot complete their multi-factor sign-in for them.'}},
 {id:'B-103',era:1,kind:'user',topology:'ground',flavor:'The Severed Thread',title:'Whole office internet down!!',tier:1,xp:{fund:60},obj:['1.4','1.10'],sla:8,reporter:'Dana (Accounting) · alarmed',start:'PC-DANA',
  symptom:'"The internet is down for the WHOLE office! Nothing loads on my PC since I came back from lunch. The cleaners were vacuuming under the desks earlier."',
  brief:'PC-DANA is patched to SW1 Gi0/6. Reception and Sales have not reported anything.',
  known:['device','when'],
  removeLinks:[['SW1','g0/6']],
  verify:[{dev:'PC-DANA',re:'^(ipconfig|get-netadapter|ping)'},{dev:'SW1',re:'^(do\\s+)?sh(ow)?\\s'}],
  check:[{dev:'PC-DANA',lines:['ipconfig']},{dev:'PC-RECEP',lines:['ping 8.8.8.8']},{dev:'SW1',lines:['enable','show interfaces status']}],see:'Media disconnected[\\s\\S]*Reply from 8\\.8\\.8\\.8[\\s\\S]*notconnect',
  guide:'cable',cause:'Dana\'s patch cable was knocked loose. The rest of the office was fine.',
  thanks:'"The cable was hanging out of the wall port! I clicked it back in and everything works. Sorry for the panic."',
  hints:['"The whole office" is the user\'s guess. Check the scope: does any other PC still work?','On PC-DANA: ipconfig. Ping 8.8.8.8 from another PC (PC-RECEP). On SW1: show interfaces status and look at Gi0/6.','"Media disconnected" on the PC and "notconnect" (not "disabled") on the switch port means no link: a cable problem, not a config problem. Do not bounce or reconfigure the port. Resolve as user error: reseat the cable.'],
  act:'Resolve: user error, with the loose-cable guidance.',
  debrief:{curse:'Not a network fault: the patch cable to PC-DANA had been pulled loose.',concept:'"notconnect" = no layer 1 link detected (cable, NIC, far end off). "disabled" = someone typed shutdown. "err-disabled" = the switch shut it. Only the last two are fixed in the CLI.',real:'Check scope before you declare an outage. One working PC turns "the whole office is down" into "one desk has a loose cable".'}},
 {id:'B-104',era:1,kind:'user',topology:'ground',flavor:'The Hungry Scribe',title:'Printer broken, network down?',tier:1,xp:{fund:60},obj:['1.10'],sla:8,reporter:'Lee (Accounting) · impatient',start:'PC-ACCT',

  guide:'paper',cause:'PRN-1 was out of paper; the network path to it was fine.',

  debrief:{curse:'Not a network fault: PRN-1 was out of paper.',concept:'Ping proves layer 3, a TCP test on port 9100 proves the print service is reachable, and the printer status tells you the rest.',real:'"The network is down" is often a device that is simply not ready. Two quick tests save a trip to the network closet.'}},
 {id:'B-105',era:1,kind:'dup',topology:'ground',flavor:'An Echo of the Lost Lamp',title:'Hot desk 5 laptop has no internet',tier:1,xp:{fund:40},obj:['1.4'],sla:6,reporter:'Priya (Reception) · helpful',start:'LAPTOP-7',

 {id:'B-201',era:2,kind:'user',topology:'closet',flavor:'The Wrong Well',title:'Wi-Fi works, internal sites don\'t',tier:1,xp:{access:60},obj:['1.10','1.11'],sla:8,reporter:'Alex (new hire) · confused',start:'NEWHIRE',

  verify:[{dev:'NEWHIRE',re:'^(ipconfig|netsh\\s+wlan|nslookup|ping|tnc|test-netconnection|get-netipconfiguration|get-netadapter)'}],

 {id:'B-202',era:2,kind:'user',topology:'closet',flavor:'The Shouted Word',title:'Network won\'t let me sign in',tier:1,xp:{access:60},obj:['1.10','5.3'],sla:8,reporter:'Hana (HR) · frustrated',start:'PC-HR',

  known:['device','error'],
  cond:{'PC-HR':{caps:true}},
  verify:[{dev:'PC-HR',re:'^(net\\s+user|get-aduser|\\[console\\]::capslock|ping|nslookup|tnc|test-netconnection)'}],
  check:[{dev:'PC-HR',lines:['ping srv-1.netmancer.local','net user hana /domain','powershell','Get-ADUser hana -Properties LockedOut,BadLogonCount','[Console]::CapsLock']}],see:'Reply from 10\\.10\\.10\\.5[\\s\\S]*Account active\\s+Yes[\\s\\S]*BadLogonCount\\s+: 4[\\s\\S]*LockedOut\\s+: False[\\s\\S]*True',
  guide:'caps',cause:'Caps Lock was on; the account and the servers were fine.',

 {id:'B-203',era:2,kind:'user',topology:'closet',flavor:'Still in the Clouds',title:'Laptop says No internet',tier:1,xp:{access:60},obj:['1.10','1.11'],sla:8,reporter:'Noor (Marketing) · just landed',start:'NEWHIRE',

 {id:'B-204',era:2,kind:'dup',topology:'closet',flavor:'An Echo from Hall 30',title:'Studio can\'t print (again)',tier:1,xp:{access:40},obj:['2.2'],sla:6,reporter:'Studio lead · following up',start:'PC-30-1',

 {id:'B-205',era:2,kind:'team',topology:'closet',flavor:'Not Our Curse',title:'Network is eating my timesheet',tier:1,xp:{access:50},obj:['1.10'],sla:8,reporter:'Raj (Sales) · stressed',start:'PC-20-1',

  brief:'Raj is on PC-20-1 (Sales, VLAN 20). The payroll portal runs on SRV-1 and is owned by the Business apps team.',
  known:['error'],dnsAdd:{'payroll.netmancer.local':'10.10.10.5'},
  verify:[{dev:'PC-20-1',re:'^(tnc|test-netconnection|ping|nslookup|resolve-dnsname)'}],verifyHint:'One Test-NetConnection to the portal on port 443 proves the network side before you hand it over.',
  check:[{dev:'PC-20-1',lines:['nslookup payroll.netmancer.local','powershell','Test-NetConnection payroll.netmancer.local -Port 443']}],see:'Name:\\s+payroll\\.netmancer\\.local[\\s\\S]*TcpTestSucceeded : True',

  thanks:'"Business apps fixed the timesheet service. Thanks for getting it to the right people."',

 {id:'B-206',era:2,kind:'mislead',topology:'closet',flavor:'The False Plague',title:'I think my PC has a virus',tier:3,xp:{access:180},obj:['2.1'],sla:15,reporter:'Mira (Studio) · worried',start:'PC-30-1',
